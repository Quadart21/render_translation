# HTTP: ACME challenge + редирект на HTTPS (после получения сертификата)
server {
    listen 80;
    listen [::]:80;
    server_name screen.norenvpn.com;

    location /.well-known/acme-challenge/ {
        root /var/www/certbot;
    }

    location / {
        return 301 https://$host$request_uri;
    }
}
