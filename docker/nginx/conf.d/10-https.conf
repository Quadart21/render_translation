# HTTPS: reverse proxy к Node.js приложению
server {
    listen 443 ssl http2;
    listen [::]:443 ssl http2;
    server_name screen.norenvpn.com;

    ssl_certificate /etc/letsencrypt/live/screen.norenvpn.com/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/screen.norenvpn.com/privkey.pem;
    ssl_session_timeout 1d;
    ssl_session_cache shared:SSL:10m;
    ssl_protocols TLSv1.2 TLSv1.3;
    ssl_prefer_server_ciphers off;

    add_header Strict-Transport-Security "max-age=63072000" always;

    client_max_body_size 30m;

    location / {
        proxy_pass http://app:3000;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_read_timeout 300s;
        proxy_send_timeout 300s;
    }
}
