<!DOCTYPE html>
<html lang="ru">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>chat-mock</title>
  <style>
    * { box-sizing: border-box; margin: 0; padding: 0; }
    body {
      font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, 'Helvetica Neue', Arial, sans-serif;
      background: #0a0a0a;
      display: flex;
      justify-content: center;
      align-items: flex-start;
      min-height: 100vh;
      padding: 16px;
      -webkit-font-smoothing: antialiased;
      -moz-osx-font-smoothing: grayscale;
    }
    /* Логическая ширина 393 pt; высота 852 pt — фиксированный экран, чат скроллится внутри (PNG не растёт вниз) */
    .phone {
      position: relative;
      width: 393px;
      height: 852px;
      max-height: 852px;
      border-radius: 28px;
      overflow: hidden;
      box-shadow: 0 12px 48px rgba(0,0,0,0.55);
      background: #fff;
      display: flex;
      flex-direction: column;
      flex-shrink: 0;
    }

    /* Область под верхним баром и композером: чат заполняет всё, chrome — поверх */
    .phone-main {
      position: relative;
      flex: 1 1 0;
      min-height: 0;
      width: 100%;
    }
    .phone-chrome {
      position: absolute;
      top: 0;
      left: 0;
      right: 0;
      z-index: 10;
      display: flex;
      flex-direction: column !important;
      pointer-events: none;
    }
    .phone-chrome > * {
      pointer-events: auto;
    }

    /*
      Один слой размытия на весь блок «статус + строка Telegram» — без шва между ними,
      от верха экрана до низа шапки (чат скроллится под этим стеком).
    */
    .chrome-header-stack {
      position: relative;
      display: flex;
      flex-direction: column;
      flex-shrink: 0;
      border-bottom: 1px solid rgba(255, 255, 255, 0.06);
    }
    .chrome-header-stack::before {
      content: '';
      position: absolute;
      left: 0;
      right: 0;
      top: 0;
      height: calc(100% + 36px);
      z-index: 0;
      pointer-events: none;
      background: rgba(32, 41, 56, 0.58);
      backdrop-filter: blur(24px) saturate(165%);
      -webkit-backdrop-filter: blur(24px) saturate(165%);
      mask-image: linear-gradient(
        to bottom,
        #000 0%,
        #000 58%,
        rgba(0, 0, 0, 0.72) 72%,
        rgba(0, 0, 0, 0.28) 88%,
        transparent 100%
      );
      -webkit-mask-image: linear-gradient(
        to bottom,
        #000 0%,
        #000 58%,
        rgba(0, 0, 0, 0.72) 72%,
        rgba(0, 0, 0, 0.28) 88%,
        transparent 100%
      );
    }
    .theme-ios .chrome-header-stack::before {
      height: calc(100% + 40px);
      background: rgba(0, 0, 0, 0.4);
      backdrop-filter: blur(34px) saturate(185%);
      -webkit-backdrop-filter: blur(34px) saturate(185%);
      mask-image: linear-gradient(
        to bottom,
        #000 0%,
        #000 55%,
        rgba(0, 0, 0, 0.68) 70%,
        rgba(0, 0, 0, 0.22) 86%,
        transparent 100%
      );
      -webkit-mask-image: linear-gradient(
        to bottom,
        #000 0%,
        #000 55%,
        rgba(0, 0, 0, 0.68) 70%,
        rgba(0, 0, 0, 0.22) 86%,
        transparent 100%
      );
    }
    .chrome-header-stack > * {
      position: relative;
      z-index: 1;
    }
    .theme-android .chrome-header-stack .status-bar,
    .theme-android .chrome-header-stack .telegram-header {
      background: transparent !important;
      backdrop-filter: none !important;
      -webkit-backdrop-filter: none !important;
    }
    .theme-ios .chrome-header-stack .ios-status,
    .theme-ios .chrome-header-stack .ios-nav.telegram-topbar {
      background: transparent !important;
      backdrop-filter: none !important;
      -webkit-backdrop-filter: none !important;
    }

    .theme-android-only { display: flex; }
    .theme-ios-only { display: none !important; }
    .theme-ios .theme-android-only { display: none !important; }
    .theme-ios .theme-ios-only { display: flex !important; }
    .theme-ios .theme-ios-only.ios-pinned-row,
    .theme-ios .theme-ios-only.ios-composer-row { display: block !important; }
    .theme-ios .ios-nav.theme-ios-only {
      display: grid !important;
    }
    .theme-ios .ios-status.theme-ios-only {
      display: grid !important;
    }
    .theme-android .status-bar.theme-android-only {
      display: grid !important;
    }

    /* ——— Telegram ANDROID DARK MATERIAL ——— */
    .theme-android {
      --tg-bg: #0f1723;
      --tg-surface: #1d2733;
      --tg-surface-light: #243041;
      --tg-outgoing-1: #8d44db;
      --tg-outgoing-2: #5a7cff;
      --tg-incoming: #1f2a36;
      --tg-accent: #5ea7ff;
      --tg-text: #ffffff;
      --tg-text-soft: rgba(255, 255, 255, 0.72);
      --tg-text-fade: rgba(255, 255, 255, 0.42);
      --tg-border: rgba(255, 255, 255, 0.04);
      --tg-radius-xl: 26px;
      --tg-radius-lg: 22px;
      --tg-radius-md: 18px;
      --tg-radius-sm: 12px;
      --tg-shadow: 0 4px 20px rgba(0, 0, 0, 0.28);
      --tg-font: Roboto, 'Noto Sans', system-ui, sans-serif;
      --incoming-bg: var(--tg-incoming);
      --incoming-text: var(--tg-text);
      --out-text: var(--tg-text);
      --chat-bg: var(--tg-bg);
    }

    /* ——— Telegram iOS DARK UI (токены + совместимость со старыми --ios-*) ——— */
    .theme-ios {
      --tg-bg: #000000;
      --tg-glass: rgba(28, 28, 30, 0.72);
      --tg-purple: #a855f7;
      --tg-blue: #4f7cff;
      --tg-text: #ffffff;
      --tg-text-soft: rgba(255, 255, 255, 0.72);
      --tg-text-fade: rgba(255, 255, 255, 0.42);
      --tg-border: rgba(255, 255, 255, 0.05);
      --tg-shadow: 0 8px 30px rgba(0, 0, 0, 0.35);
      --tg-radius-xl: 28px;
      --tg-radius-lg: 22px;
      --tg-radius-md: 18px;
      --tg-radius-sm: 14px;
      --tg-blur: blur(30px) saturate(180%);
      --ios-bg: var(--tg-bg);
      --ios-nav: var(--tg-glass);
      --ios-in-text: var(--tg-text);
      --ios-out-text: var(--tg-text);
      --ios-date-pill: rgba(34, 34, 34, 0.76);
      --ios-date-text: rgba(255, 255, 255, 0.92);
      --ios-subtitle: #2f8cff;
    }

    .theme-ios.phone {
      background: var(--tg-bg);
      border-radius: var(--tg-radius-xl);
      box-shadow: var(--tg-shadow);
    }

    /* Android status bar — время слева, трей справа без обрезания */
    .status-bar {
      position: relative;
      z-index: 5;
      min-height: 34px;
      padding: 8px 12px 6px;
      display: grid;
      grid-template-columns: auto max-content;
      align-items: center;
      gap: 8px;
      box-sizing: border-box;
      overflow: visible;
      background: transparent;
      color: #fff;
      font-size: 16px;
      font-weight: 600;
      flex-shrink: 0;
    }
    .android-status-tray {
      display: flex;
      align-items: center;
      justify-content: flex-end;
      gap: 8px;
      font-variant-numeric: tabular-nums;
      opacity: 0.95;
      font-size: 16px;
      font-weight: 600;
    }
    .status-tray-icon {
      display: block;
      flex-shrink: 0;
      object-fit: contain;
      pointer-events: none;
    }
    .theme-android .status-bar .status-tray-signal {
      width: 30px;
      height: 18px;
      opacity: 0.98;
    }
    .theme-android .status-bar .status-tray-wifi {
      width: 24px;
      height: 18px;
      opacity: 0.98;
    }

    .theme-android .telegram-header {
      position: relative;
      z-index: 5;
      display: flex;
      align-items: center;
      padding: 10px 14px 14px 8px;
      gap: 6px;
      background: transparent;
      flex-shrink: 0;
    }
    .theme-android .back-button {
      width: 42px;
      height: 42px;
      display: flex;
      align-items: center;
      justify-content: center;
      border-radius: 50%;
      color: #fff;
      font-size: 24px;
      flex-shrink: 0;
    }
    .theme-android .chat-info {
      display: flex;
      align-items: center;
      margin-left: 4px;
      flex: 1;
      min-width: 0;
    }
    .theme-android .chat-avatar {
      width: 56px;
      height: 56px;
      border-radius: 50%;
      overflow: hidden;
      object-fit: cover;
      flex-shrink: 0;
      background: var(--tg-surface);
    }
    .theme-android .chat-avatar.placeholder {
      display: flex;
      align-items: center;
      justify-content: center;
      font-size: 22px;
      font-weight: 700;
      color: var(--tg-text-soft);
    }
    .theme-android .chat-meta {
      margin-left: 14px;
      min-width: 0;
    }
    .theme-android .chat-meta .name {
      color: #fff;
      font-size: 20px;
      font-weight: 700;
      white-space: nowrap;
      overflow: hidden;
      text-overflow: ellipsis;
    }
    .theme-android .chat-meta .status {
      margin-top: 2px;
      color: rgba(255, 255, 255, 0.55);
      font-size: 15px;
      font-weight: 500;
      white-space: nowrap;
      overflow: hidden;
      text-overflow: ellipsis;
    }
    .theme-android .header-actions {
      display: flex;
      align-items: center;
      gap: 18px;
      color: #fff;
      font-size: 24px;
      flex-shrink: 0;
    }

    .theme-android .pinned-container {
      position: relative;
      z-index: 6;
      display: block;
      margin: 0 12px;
      padding: 10px 14px;
      border-radius: 0 0 var(--tg-radius-md) var(--tg-radius-md);
      background: rgba(31, 42, 56, 0.82);
      backdrop-filter: blur(20px);
      -webkit-backdrop-filter: blur(20px);
      flex-shrink: 0;
    }
    .theme-android .pinned-container .pinned-message {
      display: flex;
      align-items: stretch;
      justify-content: space-between;
      gap: 12px;
    }
    .theme-android .pinned-container .pinned-left {
      display: flex;
      align-items: stretch;
      gap: 12px;
      min-width: 0;
    }
    .theme-android .pin-accent {
      width: 4px;
      min-height: 44px;
      align-self: stretch;
      border-radius: 999px;
      background: var(--tg-accent);
      flex-shrink: 0;
    }
    /* строка 1: подпись; строка 2: текст закрепа (до 36 символов в JS) */
    .theme-android .pinned-container .pin-text {
      display: flex;
      flex-direction: column;
      align-items: flex-start;
      gap: 3px;
      min-width: 0;
      flex: 1;
    }
    .theme-android .pinned-container .pin-text .title {
      color: #77b7ff;
      font-size: 13px;
      font-weight: 600;
      line-height: 1.2;
      white-space: nowrap;
    }
    .theme-android .pinned-container .pin-text .subtitle {
      margin-top: 0;
      color: rgba(255, 255, 255, 0.72);
      font-size: 14px;
      font-weight: 500;
      line-height: 1.25;
      white-space: nowrap;
      overflow: hidden;
      text-overflow: ellipsis;
      max-width: 100%;
      min-width: 0;
    }

    .theme-android .input-panel {
      flex-shrink: 0;
      padding: 10px 12px 14px;
      display: flex;
      align-items: center;
      gap: 10px;
      background: linear-gradient(
        to top,
        rgba(15, 23, 35, 0.96),
        rgba(15, 23, 35, 0.82)
      );
      border-top: 1px solid var(--tg-border);
    }
    .theme-android .input-panel .input-action {
      width: 48px;
      height: 48px;
      display: flex;
      align-items: center;
      justify-content: center;
      border-radius: 50%;
      color: rgba(255, 255, 255, 0.88);
      font-size: 24px;
      flex-shrink: 0;
    }
    .theme-android .input-panel .message-input {
      flex: 1;
      height: 54px;
      padding: 0 18px;
      border-radius: 999px;
      background: #1f2a38;
      border: 1px solid rgba(255, 255, 255, 0.03);
      color: var(--tg-text-fade);
      font-size: 18px;
      display: flex;
      align-items: center;
    }
    .theme-android .input-panel .voice-button {
      width: 56px;
      height: 56px;
      display: flex;
      align-items: center;
      justify-content: center;
      border-radius: 50%;
      background: #45a2ff;
      color: #fff;
      font-size: 26px;
      flex-shrink: 0;
      box-shadow: 0 4px 18px rgba(69, 162, 255, 0.38);
    }

    .theme-android .scroll-down {
      position: absolute;
      right: 16px;
      bottom: 92px;
      width: 58px;
      height: 58px;
      display: flex;
      align-items: center;
      justify-content: center;
      border-radius: 50%;
      background: #1f2a38;
      color: #fff;
      font-size: 26px;
      box-shadow: 0 6px 24px rgba(0, 0, 0, 0.34);
      z-index: 9;
      pointer-events: none;
    }

    .theme-android.phone.chat-under-header .chrome-header-stack::before {
      background: rgba(32, 41, 56, 0.72);
      backdrop-filter: blur(22px) saturate(160%);
      -webkit-backdrop-filter: blur(22px) saturate(160%);
    }

    .theme-android.phone {
      background: var(--tg-bg);
      font-family: var(--tg-font);
      border-radius: var(--tg-radius-xl);
      box-shadow: var(--tg-shadow);
    }

    /* iOS status bar — симметричные боковые колонки, плашка Telegram по центру экрана */
    .ios-status {
      display: grid;
      grid-template-columns: minmax(80px, 1fr) auto minmax(80px, 1fr);
      align-items: center;
      gap: 6px;
      position: relative;
      z-index: 5;
      min-height: 54px;
      height: auto;
      box-sizing: border-box;
      overflow: visible;
      background: transparent;
      color: #fff;
      padding: 12px 12px 8px;
      flex-shrink: 0;
      font-size: 16px;
      font-weight: 600;
      letter-spacing: -0.02em;
    }
    .ios-time {
      min-width: 0;
      justify-self: start;
      flex-shrink: 0;
    }
    .ios-island-wrap {
      display: flex;
      justify-content: center;
      justify-self: center;
      min-width: 0;
      pointer-events: none;
    }
    .ios-island {
      height: 28px;
      min-width: 0;
      max-width: min(200px, 100%);
      padding: 0 12px;
      border-radius: 20px;
      background: linear-gradient(180deg, #1e88e5 0%, #1565c0 100%);
      display: flex;
      align-items: center;
      justify-content: center;
      gap: 6px;
      font-size: 11px;
      font-weight: 700;
      color: #fff;
      letter-spacing: 0.02em;
    }
    .ios-tray {
      justify-self: end;
      display: flex;
      align-items: center;
      justify-content: flex-end;
      gap: 8px;
      font-size: 16px;
      font-weight: 600;
      color: rgba(255,255,255,0.92);
      flex-shrink: 0;
      white-space: nowrap;
    }
    .theme-ios .ios-tray .status-tray-signal {
      width: 30px;
      height: 18px;
      opacity: 0.98;
    }
    .theme-ios .ios-tray .status-tray-wifi {
      width: 24px;
      height: 18px;
      opacity: 0.98;
    }
    .ios-battery {
      margin-left: 2px;
      font-variant-numeric: tabular-nums;
    }

    /* Top bar: без position:fixed — только внутри .phone для PNG */
    .ios-nav.telegram-topbar {
      display: grid;
      position: relative;
      z-index: 5;
      background: transparent;
      /* слева назад, центр — заголовок, справа аватар */
      grid-template-columns: minmax(72px, auto) minmax(0, 1fr) 52px;
      align-items: center;
      justify-items: stretch;
      column-gap: 6px;
      padding: 12px 14px;
      flex-shrink: 0;
      border-bottom: none;
    }

    .theme-ios.phone.chat-under-header .chrome-header-stack::before {
      background: rgba(0, 0, 0, 0.52);
      backdrop-filter: blur(30px) saturate(180%);
      -webkit-backdrop-filter: blur(30px) saturate(180%);
    }
    .ios-nav-left {
      justify-self: start;
      min-width: 0;
      flex-shrink: 0;
      display: flex;
      align-items: center;
    }
    .ios-nav-right {
      justify-self: end;
      width: 52px;
      height: 52px;
      display: flex;
      align-items: center;
      justify-content: center;
      flex-shrink: 0;
    }
    .ios-nav-right .ios-nav-avatar,
    .ios-nav-right .ios-nav-avatar.placeholder {
      width: 52px;
      height: 52px;
    }
    /* BACK — как .back-pill */
    .theme-ios .ios-back.back-pill {
      display: flex;
      align-items: center;
      gap: 8px;
      min-width: 96px;
      height: 52px;
      padding: 0 14px;
      border-radius: 999px;
      background: rgba(25, 25, 25, 0.76);
      backdrop-filter: blur(24px);
      -webkit-backdrop-filter: blur(24px);
      border: 1px solid var(--tg-border);
      box-shadow: var(--tg-shadow);
      max-width: 126px;
      flex-shrink: 0;
      overflow: hidden;
    }
    .ios-chevron {
      color: #6ab7ff;
      font-size: 28px;
      font-weight: 300;
      line-height: 1;
      flex-shrink: 0;
      margin-top: -2px;
    }
    .ios-unread-pill {
      background: transparent;
      color: rgba(255, 255, 255, 0.96);
      font-size: 18px;
      font-weight: 500;
      padding: 0;
      border-radius: 0;
      font-variant-numeric: tabular-nums;
      white-space: nowrap;
      letter-spacing: -0.02em;
      min-width: 0;
      overflow: hidden;
      text-overflow: ellipsis;
    }
    .ios-nav-mid {
      justify-self: stretch;
      min-width: 0;
      max-width: 100%;
      overflow: hidden;
      display: flex;
      justify-content: center;
      align-items: center;
    }
    /* USER — как .user-pill */
    .theme-ios .ios-title-pill.user-pill {
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      min-width: 0;
      width: auto;
      max-width: 100%;
      padding: 10px 14px;
      border-radius: 999px;
      background: rgba(24, 24, 24, 0.78);
      backdrop-filter: blur(28px);
      -webkit-backdrop-filter: blur(28px);
      border: 1px solid rgba(255, 255, 255, 0.04);
      box-shadow: var(--tg-shadow);
      text-align: center;
    }
    .ios-title-line {
      display: flex;
      align-items: center;
      justify-content: center;
      gap: 6px;
      min-width: 0;
    }
    .ios-nav-title {
      font-size: 19px;
      font-weight: 700;
      color: var(--tg-text);
      line-height: 1.2;
      letter-spacing: -0.3px;
      white-space: nowrap;
      overflow: hidden;
      text-overflow: ellipsis;
      max-width: 100%;
    }
    .ios-title-badge {
      display: inline-block;
      flex-shrink: 0;
      width: 11px;
      height: 11px;
      border-radius: 2px;
      background: rgba(255,255,255,0.38);
      opacity: 0.85;
      vertical-align: middle;
    }
    .ios-nav-sub {
      font-size: 14px;
      font-weight: 500;
      color: var(--ios-subtitle);
      margin-top: 2px;
      line-height: 1.2;
      white-space: nowrap;
      overflow: hidden;
      text-overflow: ellipsis;
      max-width: 100%;
      min-width: 0;
      width: 100%;
    }
    .ios-nav-avatar.user-avatar {
      border-radius: 50%;
      overflow: hidden;
      object-fit: cover;
      flex-shrink: 0;
      background: #2a2a2e;
      border: 1px solid rgba(255, 255, 255, 0.06);
    }
    .ios-nav-avatar.placeholder {
      display: flex;
      align-items: center;
      justify-content: center;
      font-size: 17px;
      font-weight: 600;
      color: rgba(255, 255, 255, 0.78);
    }

    .ios-pinned-row {
      position: relative;
      z-index: 6;
      background: transparent;
      padding: 0 16px 12px;
      flex-shrink: 0;
    }
    .theme-ios.phone.chat-under-pinned .ios-pinned-inner.pinned-message {
      background: rgba(26, 26, 26, 0.58);
    }
    /* строка 1: «Закреплённое сообщение»; строка 2: превью текста (до 36 символов в JS) */
    .ios-pinned-inner.pinned-message {
      position: relative;
      display: flex;
      flex-direction: column;
      align-items: stretch;
      gap: 4px;
      padding: 12px 44px 12px 18px;
      border-radius: var(--tg-radius-lg);
      background: rgba(26, 26, 26, 0.82);
      backdrop-filter: blur(28px);
      -webkit-backdrop-filter: blur(28px);
      border: 1px solid rgba(255, 255, 255, 0.04);
      box-shadow: var(--tg-shadow);
      line-height: 1.25;
      min-width: 0;
    }
    .ios-pinned-inner.pinned-message .title {
      font-size: 13px;
      font-weight: 600;
      color: rgba(255, 255, 255, 0.62);
      white-space: nowrap;
    }
    .ios-pinned-inner.pinned-message .content {
      margin-top: 0;
      font-size: 14px;
      font-weight: 500;
      color: rgba(255, 255, 255, 0.82);
      white-space: nowrap;
      overflow: hidden;
      text-overflow: ellipsis;
      max-width: 100%;
      min-width: 0;
    }
    .ios-pin-icon {
      position: absolute;
      right: 12px;
      top: 50%;
      transform: translateY(-50%);
      font-size: 17px;
      opacity: 0.55;
      line-height: 1;
      pointer-events: none;
    }

    /* Лента на весь phone-main; padding-top — запас под «стекло» сверху, контент скроллится под него */

      overflow-y: auto;

    /*

      content: '';

<body>
  <div class="phone" id="phone">
    <div class="phone-main">
      <!-- Лента на весь фрейм; статус/шапка/закреп — отдельный слой поверх (сообщения уходят под «стекло») -->
      <div class="chat-wrap" id="chat"></div>

      <div class="phone-chrome theme-android-only">
        <div class="chrome-header-stack">
          <div class="status-bar">
            <span id="androidTime"></span>
            <div class="android-status-tray">
              <img class="status-tray-icon status-tray-signal" src="__ICON_SIGNAL__" alt="" width="30" height="18" decoding="async" aria-hidden="true" />
              <img class="status-tray-icon status-tray-wifi" src="__ICON_WIFI__" alt="" width="24" height="18" decoding="async" aria-hidden="true" />
              <span id="androidBattery"></span>
            </div>
          </div>
          <header class="telegram-header">
            <div class="back-button" aria-hidden="true">&#8592;</div>
            <div class="chat-info">
              <div class="chat-avatar placeholder" id="androidAvatarPh"></div>
              <img class="chat-avatar" id="androidAvatarImg" alt="" style="display:none" />
              <div class="chat-meta">

                <div class="status" id="androidChatStatus"></div>
              </div>
            </div>
            <div class="header-actions">

              <span aria-hidden="true">&#8942;</span>

          </header>

        <div class="pinned-container" id="androidPinnedWrap" hidden>
          <div class="pinned-message">

              <div class="pin-accent"></div>
              <div class="pin-text">
                <div class="title">Закреплённое сообщение</div>

        <div class="chrome-header-stack">

              <div class="ios-island" aria-hidden="true">Telegram</div>

              <img class="status-tray-icon status-tray-signal" src="__ICON_SIGNAL__" alt="" width="30" height="18" decoding="async" aria-hidden="true" />
              <img class="status-tray-icon status-tray-wifi" src="__ICON_WIFI__" alt="" width="24" height="18" decoding="async" aria-hidden="true" />

    <div class="scroll-down theme-android-only" aria-hidden="true">&#8595;</div>

    <div class="input-panel theme-android-only">

    <div class="ios-composer-row message-input-bar theme-ios-only">
      <div class="ios-composer">
        <div class="ios-attach circle-button">
          <img class="composer-tool-icon" src="__ICON_ATTACH__" alt="" width="22" height="22" decoding="async" />

          </span>
        </div>

          <img class="composer-tool-icon" src="__ICON_MIC__" alt="" width="22" height="22" decoding="async" />

  <script type="application/json" id="scene-data">__SCENE_JSON__</script>
  <script>
    (function () {
      var el = document.getElementById('scene-data');
      var scene = JSON.parse(el.textContent);
      var platform = scene.platform === 'ios' ? 'ios' : 'android';
      var phone = document.getElementById('phone');
      phone.classList.add(platform === 'ios' ? 'theme-ios' : 'theme-android');

      var timeStr = scene.statusBar && scene.statusBar.time ? scene.statusBar.time : '';
      var battery = scene.statusBar && scene.statusBar.battery != null ? String(scene.statusBar.battery) : '';

      /** Только текст закреплённого сообщения (не подпись): макс. 36 символов + «…» */
      function truncatePinnedText(s) {
        if (s == null) return '';
        var str = String(s);
        return str.length <= 36 ? str : str.slice(0, 36) + '...';
      }

      if (platform === 'android') {
        document.getElementById('androidTime').textContent = timeStr;
        var tray = document.getElementById('androidBattery');
        if (battery) {
          tray.textContent = battery.indexOf('%') >= 0 ? battery : battery + '%';
        } else {
          tray.textContent = '';
        }

        var counterpartyA =
          scene.participants.find(function (p) {
            return p.side === 'left';
          }) || scene.participants[0];
        document.getElementById('androidChatName').textContent = counterpartyA
          ? counterpartyA.name
          : 'Чат';

        var headerMetaA = scene.header || {};
        var subA = typeof headerMetaA.subtitle === 'string' ? headerMetaA.subtitle : '';
        var stA = document.getElementById('androidChatStatus');
        if (subA) {
          stA.textContent = subA;
          stA.style.display = 'block';
        } else {
          stA.style.display = 'none';
        }

        var imgPhA = document.getElementById('androidAvatarPh');
        var imgElA = document.getElementById('androidAvatarImg');
        if (counterpartyA && counterpartyA.avatar) {
          imgElA.src = counterpartyA.avatar;
          imgElA.style.display = 'block';
          imgPhA.style.display = 'none';
        } else {
          imgElA.style.display = 'none';
          imgPhA.style.display = 'flex';
          imgPhA.textContent = counterpartyA && counterpartyA.name
            ? counterpartyA.name.charAt(0).toUpperCase()
            : '?';
        }

        var pinnedA = scene.pinned && scene.pinned.text;
        var apw = document.getElementById('androidPinnedWrap');
        if (pinnedA) {
          apw.hidden = false;
          document.getElementById('androidPinnedSubtitle').textContent =
            truncatePinnedText(pinnedA);
        }
      } else {
        document.getElementById('iosTime').textContent = timeStr;
        var batEl = document.getElementById('iosBattery');
        if (battery) {
          batEl.textContent = battery.indexOf('%') >= 0 ? battery : battery + '%';
        } else {
          batEl.textContent = '';
          batEl.style.display = 'none';
        }

        var cp = scene.participants.find(function (p) { return p.side === 'left'; }) || scene.participants[0];
        document.getElementById('iosNavTitle').textContent = cp ? cp.name : 'Чат';

        var headerMeta = scene.header || {};
        var sub = typeof headerMeta.subtitle === 'string' ? headerMeta.subtitle : '';
        var subEl = document.getElementById('iosNavSub');
        if (sub) {
          subEl.textContent = sub;
          subEl.style.display = 'block';
        } else {
          subEl.style.display = 'none';
        }

        var badge = headerMeta.backBadge;
        var backEl = document.getElementById('iosBack');
        var chev = '<span class="ios-chevron">&#8249;</span>';
        if (badge != null && badge !== '') {
          backEl.innerHTML =
            chev + '<span class="ios-unread-pill counter">' + escapeHtml(String(badge)) + '</span>';
        } else {
          backEl.innerHTML = chev;
        }

        var badgeEl = document.getElementById('iosTitleBadge');
        if (headerMeta.hideTitleBadge === true) {
          badgeEl.style.display = 'none';
        } else {
          badgeEl.style.display = '';
        }

        var imgPh = document.getElementById('iosNavAvatarPh');
        var imgEl = document.getElementById('iosNavAvatarImg');
        if (cp && cp.avatar) {
          imgEl.src = cp.avatar;
          imgEl.style.display = 'block';
          imgPh.style.display = 'none';
        } else {
          imgEl.style.display = 'none';
          imgPh.style.display = 'flex';
          imgPh.textContent = cp && cp.name ? cp.name.charAt(0).toUpperCase() : '?';
        }

        var pinned = scene.pinned && scene.pinned.text;
        var pw = document.getElementById('iosPinnedWrap');
        if (pinned) {
          pw.hidden = false;
          document.getElementById('iosPinnedInner').innerHTML =
            '<span class="title">Закреплённое сообщение</span><span class="content">' +
            escapeHtml(truncatePinnedText(pinned)) +
            '</span><span class="ios-pin-icon" aria-hidden="true">\uD83D\uDCCC</span>';
        }
      }

      var msgItems = (scene.items || []).filter(function (it) {
        return it.type === 'text' || it.type === 'image';
      });
      var msgCount = msgItems.length;
      var hasPinText = !!(scene.pinned && scene.pinned.text);
      var underMode =
        hasPinText && msgCount > 9
          ? 'pinned'
          : !hasPinText && msgCount > 11
            ? 'header'
            : null;
      if (underMode) {
        phone.classList.add('chat-under-' + underMode);
      }

      var participants = {};
      (scene.participants || []).forEach(function (p) {
        participants[p.id] = p;
      });

      var chat = document.getElementById('chat');
      var outIdx = 0;

      (scene.items || []).forEach(function (item) {
        if (item.type === 'date') {
          var ds = document.createElement('div');
          ds.className = 'date-sep';
          var spanTag =
            platform === 'ios' || platform === 'android'
              ? '<span class="date-divider">' + escapeHtml(item.label || '') + '</span>'
              : '<span>' + escapeHtml(item.label || '') + '</span>';
          ds.innerHTML = spanTag;
          chat.appendChild(ds);
          return;
        }

        var part = participants[item.from];
        if (!part) return;
        var outgoing = part.side === 'right';

        var row = document.createElement('div');
        row.className = 'row ' + (outgoing ? 'out' : 'in');

        var col = document.createElement('div');
        col.className = 'bubble-col';

        var bubble = document.createElement('div');
        bubble.className = 'bubble';
        if (platform === 'ios' && outgoing) {
          bubble.classList.add(outIdx % 2 === 0 ? 'out-purple' : 'out-blue');
          outIdx++;
        }

        if (item.type === 'text') {
          bubble.appendChild(document.createTextNode(item.text || ''));
        } else if (item.type === 'image') {
          if (item.src) {
            var im = document.createElement('img');
            im.className = 'pic';
            im.src = item.src;
            im.alt = '';
            bubble.appendChild(im);
          } else {
            var ph = document.createElement('div');
            ph.className = 'img-placeholder';
            ph.textContent = 'Изображение';
            bubble.appendChild(ph);
          }
          if (item.caption) {
            var cap = document.createElement('div');
            cap.className = 'caption';
            cap.textContent = item.caption;
            bubble.appendChild(cap);
          }
        }

        var meta = document.createElement('span');
        meta.className = 'meta';
        meta.appendChild(document.createTextNode(item.time || ''));
        if ((platform === 'ios' || platform === 'android') && outgoing) {
          var ck = document.createElement('span');
          ck.className = 'checks';
          ck.textContent = '\u2713\u2713';
          meta.appendChild(ck);
        }
        bubble.appendChild(meta);

        col.appendChild(bubble);
        row.appendChild(col);

        chat.appendChild(row);
      });

      function escapeHtml(s) {
        var d = document.createElement('div');
        d.textContent = s;
        return d.innerHTML;
      }
    })();
  </script>
</body>
</html>
