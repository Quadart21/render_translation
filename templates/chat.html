<!DOCTYPE html>
<html lang="ru">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>chat-mock</title>
  <style>
    /* SF Pro Text: базовый контур — assets/fonts/sf-pro-text/SFProText-Regular.ttf (подмешивается в PNG через render) */
    __IOS_FONT_FACES__
    * { box-sizing: border-box; margin: 0; padding: 0; }
    body {
      font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, 'Helvetica Neue', Arial, sans-serif;
      background: #0a0a0a;
      display: flex;
      justify-content: center;
      align-items: flex-start;
      min-height: 100vh;
      padding: 16px;
      -webkit-font-smoothing: antialiased;
      -moz-osx-font-smoothing: grayscale;
    }
    /* iOS-мок в Chromium: более «печатный» контур букв + отключён синтетический bold */
    .theme-ios.phone {
      text-rendering: geometricPrecision;
      -webkit-font-smoothing: subpixel-antialiased;
      font-synthesis: none;
      font-optical-sizing: none;
    }
    /* Логическая ширина 393 pt; высота 852 pt — фиксированный экран, чат скроллится внутри (PNG не растёт вниз) */
    .phone {
      position: relative;
      width: 393px;
      height: 852px;
      max-height: 852px;
      border-radius: 28px;
      overflow: hidden;
      box-shadow: 0 12px 48px rgba(0,0,0,0.55);
      background: #fff;
      display: flex;
      flex-direction: column;
      flex-shrink: 0;
    }

    /* Область под верхним баром и композером: чат заполняет всё, chrome — поверх */
    .phone-main {
      position: relative;
      flex: 1 1 0;
      min-height: 0;
      width: 100%;
    }
    .phone-chrome {
      position: absolute;
      top: 0;
      left: 0;
      right: 0;
      z-index: 10;
      display: flex;
      flex-direction: column !important;
      pointer-events: none;
    }
    .phone-chrome > * {
      pointer-events: auto;
    }

    /*
      Один слой размытия на весь блок «статус + строка Telegram» — без шва между ними,
      от верха экрана до низа шапки (чат скроллится под этим стеком).
    */
    .chrome-header-stack {
      position: relative;
      display: flex;
      flex-direction: column;
      flex-shrink: 0;
      border-bottom: 1px solid rgba(255, 255, 255, 0.06);
    }
    .chrome-header-stack::before {
      content: '';
      position: absolute;
      left: 0;
      right: 0;
      top: 0;
      height: calc(100% + 36px);
      z-index: 0;
      pointer-events: none;
      background: rgba(32, 41, 56, 0.58);
      backdrop-filter: blur(24px) saturate(165%);
      -webkit-backdrop-filter: blur(24px) saturate(165%);
      mask-image: linear-gradient(
        to bottom,
        #000 0%,
        #000 58%,
        rgba(0, 0, 0, 0.72) 72%,
        rgba(0, 0, 0, 0.28) 88%,
        transparent 100%
      );
      -webkit-mask-image: linear-gradient(
        to bottom,
        #000 0%,
        #000 58%,
        rgba(0, 0, 0, 0.72) 72%,
        rgba(0, 0, 0, 0.28) 88%,
        transparent 100%
      );
    }
    .theme-android .chrome-header-stack {
      border-bottom-color: rgba(255, 255, 255, 0.05);
    }
    .theme-android .chrome-header-stack::before {
      height: calc(100% + 36px);
      background: rgba(15, 15, 16, 0.92);
      backdrop-filter: blur(8px) saturate(120%);
      -webkit-backdrop-filter: blur(8px) saturate(120%);
      mask-image: linear-gradient(
        to bottom,
        #000 0%,
        #000 60%,
        rgba(0, 0, 0, 0.72) 74%,
        rgba(0, 0, 0, 0.26) 88%,
        transparent 100%
      );
      -webkit-mask-image: linear-gradient(
        to bottom,
        #000 0%,
        #000 60%,
        rgba(0, 0, 0, 0.72) 74%,
        rgba(0, 0, 0, 0.26) 88%,
        transparent 100%
      );
    }
    /* Верхняя панель iOS: подложка под blur на ~30% прозрачнее (альфа ×0.7), остальной UI без изменений */
    .theme-ios .chrome-header-stack::before {
      height: calc(100% + 40px);
      background: rgba(0, 0, 0, 0.28);
      backdrop-filter: blur(22px) saturate(168%);
      -webkit-backdrop-filter: blur(22px) saturate(168%);
      mask-image: linear-gradient(
        to bottom,
        #000 0%,
        #000 55%,
        rgba(0, 0, 0, 0.476) 70%,
        rgba(0, 0, 0, 0.154) 86%,
        transparent 100%
      );
      -webkit-mask-image: linear-gradient(
        to bottom,
        #000 0%,
        #000 55%,
        rgba(0, 0, 0, 0.476) 70%,
        rgba(0, 0, 0, 0.154) 86%,
        transparent 100%
      );
    }
    .chrome-header-stack > * {
      position: relative;
      z-index: 1;
    }
    .theme-android .chrome-header-stack .status-bar,
    .theme-android .chrome-header-stack .telegram-header {
      background: transparent !important;
      backdrop-filter: none !important;
      -webkit-backdrop-filter: none !important;
    }
    .theme-ios .chrome-header-stack .ios-status,
    .theme-ios .chrome-header-stack .ios-nav.telegram-topbar {
      background: transparent !important;
      backdrop-filter: none !important;
      -webkit-backdrop-filter: none !important;
    }

    .theme-android-only { display: flex; }
    .theme-ios-only { display: none !important; }
    .theme-ios .theme-android-only { display: none !important; }
    .theme-ios .theme-ios-only { display: flex !important; }
    .theme-ios .theme-ios-only.ios-pinned-row,
    .theme-ios .theme-ios-only.ios-composer-row { display: block !important; }
    .theme-ios .ios-nav.theme-ios-only {
      display: grid !important;
    }
    .theme-ios .ios-status.theme-ios-only {
      display: grid !important;
    }
    .theme-android .status-bar.theme-android-only {
      display: grid !important;
    }

    /* ——— Telegram ANDROID DARK (Telegram-like тёмный слой + фиолетовые исходящие) ——— */
    .theme-android {
      --tg-bg: #0f0f10;
      --tg-surface: #1a1a1d;
      --tg-surface-light: #222226;
      --tg-outgoing-1: #8b7aff;
      --tg-outgoing-2: #6b5bdc;
      --tg-incoming: #2a2a2d;
      --tg-accent: #7a64ff;
      --tg-text: #ffffff;
      --tg-text-soft: rgba(255, 255, 255, 0.72);
      --tg-text-fade: rgba(255, 255, 255, 0.42);
      --tg-border: rgba(255, 255, 255, 0.04);
      --tg-radius-xl: 26px;
      --tg-radius-lg: 22px;
      --tg-radius-md: 18px;
      --tg-radius-sm: 12px;
      --tg-shadow: 0 2px 10px rgba(0, 0, 0, 0.22);
      --tg-font: Roboto, 'Noto Sans', system-ui, sans-serif;
      --incoming-bg: var(--tg-incoming);
      --incoming-text: var(--tg-text);
      --out-text: var(--tg-text);
      --chat-bg: var(--tg-bg);
    }

    /* ——— Telegram iOS DARK UI (токены + совместимость со старыми --ios-*) ——— */
    .theme-ios {
      --tg-font: 'SF Pro Text', -apple-system, BlinkMacSystemFont, 'Helvetica Neue', sans-serif;
      --tg-bg: #000000;
      --tg-glass: rgba(28, 28, 30, 0.72);
      --tg-purple: #a855f7;
      --tg-blue: #4f7cff;
      --tg-text: #ffffff;
      --tg-text-soft: rgba(255, 255, 255, 0.72);
      --tg-text-fade: rgba(255, 255, 255, 0.42);
      --tg-border: rgba(255, 255, 255, 0.05);
      --tg-shadow: 0 8px 30px rgba(0, 0, 0, 0.35);
      --tg-radius-xl: 28px;
      --tg-radius-lg: 22px;
      --tg-radius-md: 18px;
      --tg-radius-sm: 14px;
      --tg-blur: blur(20px) saturate(165%);
      --ios-bg: var(--tg-bg);
      --ios-nav: var(--tg-glass);
      --ios-in-text: var(--tg-text);
      --ios-out-text: var(--tg-text);
      --ios-date-pill: rgba(34, 34, 34, 0.76);
      --ios-date-text: rgba(255, 255, 255, 0.92);
      --ios-subtitle: #2f8cff;
    }

    .theme-ios.phone {
      background: var(--tg-bg);
      font-family: var(--tg-font);
      border-radius: var(--tg-radius-xl);
      box-shadow: var(--tg-shadow);
    }

    /* Android status bar — время слева, трей справа без обрезания */
    .status-bar {
      position: relative;
      z-index: 5;
      min-height: 34px;
      padding: 8px 12px 6px;
      display: grid;
      grid-template-columns: auto max-content;
      align-items: center;
      gap: 8px;
      box-sizing: border-box;
      overflow: visible;
      background: transparent;
      color: #fff;
      font-size: 16px;
      font-weight: 600;
      flex-shrink: 0;
    }
    .android-status-tray {
      display: flex;
      align-items: center;
      justify-content: flex-end;
      gap: 3px;
      font-variant-numeric: tabular-nums;
      opacity: 0.95;
      font-size: 16px;
      font-weight: 600;
    }
    .status-tray-icon {
      display: block;
      flex-shrink: 0;
      object-fit: contain;
      pointer-events: none;
    }
    .theme-android .status-bar .status-tray-signal {
      width: 30px;
      height: 18px;
      opacity: 0.98;
    }
    .theme-android .status-bar .status-tray-wifi {
      width: 24px;
      height: 18px;
      opacity: 0.98;
    }

    .theme-android .telegram-header {
      position: relative;
      z-index: 5;
      display: flex;
      align-items: center;
      min-height: 56px;
      padding: 6px 12px 10px 4px;
      gap: 4px;
      background: transparent;
      flex-shrink: 0;
    }
    .theme-android .back-button {
      box-sizing: border-box;
      min-width: 44px;
      width: max-content;
      max-width: min(200px, 52vw);
      height: 48px;
      padding: 0 6px 0 4px;
      display: inline-flex;
      align-items: center;
      justify-content: center;
      gap: 4px;
      border-radius: 999px;
      color: #fff;
      font-size: 22px;
      flex-shrink: 0;
    }
    .theme-android .back-button .android-back-count {
      font-size: 15px;
      font-weight: 600;
      font-variant-numeric: tabular-nums;
      line-height: 1;
      letter-spacing: -0.02em;
      white-space: nowrap;
      overflow: hidden;
      text-overflow: ellipsis;
      max-width: 11ch;
    }
    .theme-android .back-button .android-back-count[hidden] {
      display: none !important;
    }
    .theme-android .chat-info {
      display: flex;
      align-items: center;
      margin-left: 4px;
      flex: 1;
      min-width: 0;
    }
    .theme-android .chat-avatar {
      width: 48px;
      height: 48px;
      border-radius: 50%;
      overflow: hidden;
      object-fit: cover;
      flex-shrink: 0;
      background: var(--tg-surface);
    }
    .theme-android .chat-avatar.placeholder {
      display: flex;
      align-items: center;
      justify-content: center;
      font-size: 18px;
      font-weight: 700;
      color: var(--tg-text-soft);
    }
    .theme-android .chat-meta {
      margin-left: 10px;
      min-width: 0;
    }
    .theme-android .chat-meta .name {
      color: #fff;
      font-size: 17px;
      font-weight: 600;
      line-height: 1.1;
      white-space: nowrap;
      overflow: hidden;
      text-overflow: ellipsis;
    }
    .theme-android .chat-meta .status {
      margin-top: 3px;
      color: rgba(255, 255, 255, 0.55);
      font-size: 12px;
      font-weight: 500;
      white-space: nowrap;
      overflow: hidden;
      text-overflow: ellipsis;
    }
    .theme-android .header-actions {
      display: flex;
      align-items: center;
      gap: 4px;
      color: #fff;
      font-size: 22px;
      flex-shrink: 0;
    }
    .theme-android .header-actions > span {
      min-width: 44px;
      min-height: 44px;
      display: inline-flex;
      align-items: center;
      justify-content: center;
    }
    .theme-android .header-action-icon {
      display: block;
      width: 22px;
      height: 22px;
      object-fit: contain;
      pointer-events: none;
    }

    .theme-android .pinned-container {
      position: relative;
      z-index: 6;
      display: block;
      margin: 8px 8px 0;
      padding: 10px 12px;
      border-radius: 16px;
      background: rgba(34, 34, 38, 0.78);
      backdrop-filter: blur(10px) saturate(140%);
      -webkit-backdrop-filter: blur(10px) saturate(140%);
      border: 1px solid rgba(255, 255, 255, 0.06);
      box-shadow: 0 4px 24px rgba(0, 0, 0, 0.18);
      flex-shrink: 0;
    }
    .theme-android .pinned-container .pinned-message {
      display: flex;
      align-items: stretch;
      justify-content: space-between;
      gap: 12px;
    }
    .theme-android .pinned-container .pinned-left {
      display: flex;
      align-items: stretch;
      gap: 12px;
      min-width: 0;
    }
    .theme-android .pin-accent {
      width: 4px;
      min-height: 44px;
      align-self: stretch;
      border-radius: 999px;
      background: var(--tg-accent);
      flex-shrink: 0;
    }
    /* строка 1: подпись; строка 2: текст закрепа (до 36 символов в JS) */
    .theme-android .pinned-container .pin-text {
      display: flex;
      flex-direction: column;
      align-items: flex-start;
      gap: 3px;
      min-width: 0;
      flex: 1;
    }
    .theme-android .pinned-container .pin-text .title {
      color: rgba(180, 168, 255, 0.95);
      font-size: 13px;
      font-weight: 600;
      line-height: 1.2;
      white-space: nowrap;
    }
    .theme-android .pinned-container .pin-text .subtitle {
      margin-top: 0;
      color: rgba(255, 255, 255, 0.72);
      font-size: 14px;
      font-weight: 500;
      line-height: 1.25;
      white-space: nowrap;
      overflow: hidden;
      text-overflow: ellipsis;
      max-width: 100%;
      min-width: 0;
    }

    .theme-android .input-panel {
      flex-shrink: 0;
      padding: 8px 10px 12px;
      display: flex;
      align-items: center;
      gap: 8px;
      background: linear-gradient(
        to top,
        rgba(15, 15, 16, 0.96),
        rgba(15, 15, 16, 0.78)
      );
      border-top: 1px solid rgba(255, 255, 255, 0.04);
    }
    .theme-android .input-panel .input-action {
      width: 44px;
      height: 44px;
      display: flex;
      align-items: center;
      justify-content: center;
      border-radius: 50%;
      color: rgba(255, 255, 255, 0.88);
      font-size: 22px;
      flex-shrink: 0;
    }
    .theme-android .input-panel .message-input {
      flex: 1;
      min-height: 44px;
      height: 44px;
      padding: 0 14px;
      border-radius: 999px;
      background: #1f1f22;
      border: 1px solid rgba(255, 255, 255, 0.05);
      color: var(--tg-text-fade);
      font-size: 16px;
      display: flex;
      align-items: center;
    }
    .theme-android .input-panel .voice-button {
      width: 48px;
      height: 48px;
      display: flex;
      align-items: center;
      justify-content: center;
      border-radius: 50%;
      background: linear-gradient(160deg, #8f7cff, #6d58e8);
      color: #fff;
      font-size: 22px;
      flex-shrink: 0;
      box-shadow: 0 3px 14px rgba(122, 100, 255, 0.35);
    }

    .theme-android .scroll-down {
      position: absolute;
      right: 16px;
      bottom: 92px;
      width: 58px;
      height: 58px;
      display: flex;
      align-items: center;
      justify-content: center;
      border-radius: 50%;
      background: #1f2a38;
      color: #fff;
      font-size: 26px;
      box-shadow: 0 6px 24px rgba(0, 0, 0, 0.34);
      z-index: 9;
      pointer-events: none;
    }

    .theme-android.phone.chat-under-header .chrome-header-stack::before {
      background: rgba(15, 15, 16, 0.88);
      backdrop-filter: blur(10px) saturate(125%);
      -webkit-backdrop-filter: blur(10px) saturate(125%);
    }

    .theme-android.phone {
      background: var(--tg-bg);
      font-family: var(--tg-font);
      border-radius: var(--tg-radius-xl);
      box-shadow: var(--tg-shadow);
    }

    /* iOS status bar — симметричные боковые колонки, плашка Telegram по центру экрана */
    .ios-status {
      display: grid;
      grid-template-columns: minmax(80px, 1fr) auto minmax(80px, 1fr);
      align-items: center;
      gap: 6px;
      position: relative;
      z-index: 5;
      min-height: 54px;
      height: auto;
      box-sizing: border-box;
      overflow: visible;
      background: transparent;
      color: #fff;
      padding: 12px 12px 8px;
      flex-shrink: 0;
      font-size: 16px;
      font-weight: 600;
      letter-spacing: -0.02em;
    }
    .ios-time {
      min-width: 0;
      justify-self: start;
      flex-shrink: 0;
    }
    .ios-island-wrap {
      display: flex;
      justify-content: center;
      justify-self: center;
      min-width: 0;
      pointer-events: none;
    }
    .ios-island {
      height: 28px;
      min-width: 0;
      max-width: min(200px, 100%);
      padding: 0 12px;
      border-radius: 20px;
      background: linear-gradient(180deg, #1e88e5 0%, #1565c0 100%);
      display: flex;
      align-items: center;
      justify-content: center;
      gap: 6px;
      font-size: 11px;
      font-weight: 700;
      color: #fff;
      letter-spacing: 0.02em;
    }
    .ios-tray {
      justify-self: end;
      display: flex;
      align-items: center;
      justify-content: flex-end;
      gap: 3px;
      font-size: 16px;
      font-weight: 600;
      color: rgba(255,255,255,0.92);
      flex-shrink: 0;
      white-space: nowrap;
    }
    .theme-ios .ios-tray .status-tray-signal {
      width: 30px;
      height: 18px;
      opacity: 0.98;
    }
    .theme-ios .ios-tray .status-tray-wifi {
      width: 24px;
      height: 18px;
      opacity: 0.98;
    }
    /*
      Батарея iOS — как в системном статус-баре: высота с Wi‑Fi (18px), серый корпус,
      красная полоса уровня слева, крупная белая цифра. --battery-pct задаётся в JS.
    */
    .theme-ios .ios-battery-wrap {
      --battery-pct: 22%;
      display: inline-flex;
      flex-direction: row;
      align-items: center;
      gap: 2px;
      flex-shrink: 0;
      height: 18px;
    }
    .theme-ios .ios-battery-body {
      position: relative;
      box-sizing: border-box;
      width: 27px;
      height: 18px;
      border-radius: 4px;
      overflow: hidden;
      background: rgba(60, 60, 67, 0.72);
      border: 1px solid rgba(255, 255, 255, 0.22);
      box-shadow: inset 0 1px 0 rgba(255, 255, 255, 0.06);
    }
    .theme-ios .ios-battery-fill {
      position: absolute;
      left: 0;
      top: 0;
      bottom: 0;
      width: var(--battery-pct);
      max-width: 100%;
      background: linear-gradient(180deg, #ff6969 0%, #ff375f 45%, #d62828 100%);
      border-radius: 2px 0 0 2px;
    }
    .theme-ios .ios-battery-digit {
      position: absolute;
      inset: 0;
      display: flex;
      align-items: center;
      justify-content: center;
      font-size: 12px;
      font-weight: 700;
      font-variant-numeric: tabular-nums;
      letter-spacing: -0.06em;
      color: #fff;
      font-family: var(--tg-font);
      pointer-events: none;
      line-height: 1;
      text-shadow: 0 1px 2px rgba(0, 0, 0, 0.45);
      z-index: 1;
    }
    .theme-ios .ios-battery-nub {
      width: 2px;
      height: 10px;
      border-radius: 0 2px 2px 0;
      background: rgba(60, 60, 67, 0.85);
      border: 1px solid rgba(255, 255, 255, 0.18);
      border-left: none;
      flex-shrink: 0;
    }

    /* Top bar: без position:fixed — только внутри .phone для PNG */
    .ios-nav.telegram-topbar {
      display: grid;
      position: relative;
      z-index: 5;
      background: transparent;
      /* слева назад (ширина по содержимому), центр — заголовок, справа аватар */
      grid-template-columns: auto minmax(0, 1fr) 52px;
      align-items: center;
      justify-items: stretch;
      column-gap: 6px;
      padding: 12px 14px;
      flex-shrink: 0;
      border-bottom: none;
    }

    .theme-ios.phone.chat-under-header .chrome-header-stack::before {
      background: rgba(0, 0, 0, 0.364);
      backdrop-filter: blur(20px) saturate(165%);
      -webkit-backdrop-filter: blur(20px) saturate(165%);
    }
    .ios-nav-left {
      justify-self: start;
      min-width: 0;
      flex-shrink: 0;
      display: flex;
      align-items: center;
    }
    .ios-nav-right {
      justify-self: end;
      width: 52px;
      height: 52px;
      display: flex;
      align-items: center;
      justify-content: center;
      flex-shrink: 0;
    }
    .ios-nav-right .ios-nav-avatar,
    .ios-nav-right .ios-nav-avatar.placeholder {
      width: 52px;
      height: 52px;
    }
    /* BACK — как .back-pill; ширина по числу символов в счётчике, без фиксированного «короба» */
    .theme-ios .ios-back.back-pill {
      display: inline-flex;
      align-items: center;
      justify-content: center;
      gap: 6px;
      box-sizing: border-box;
      min-width: 44px;
      width: max-content;
      max-width: min(200px, 42vw);
      height: 52px;
      padding: 0 10px 0 11px;
      border-radius: 999px;

    /* Лента на весь phone-main; padding-top — запас под «стекло» сверху, контент скроллится под него */
    .chat-wrap {

      inset: 0;
      z-index: 1;
      overflow-x: hidden;
      overflow-y: auto;
      -webkit-overflow-scrolling: touch;

    /*
      Мягкий скрим у верхнего края ленты (без второго backdrop — иначе «рейка» на закрепе).
      Absolute к viewport прокрутки #chat: при скролле не уезжает вместе с пузырями.
    */
    .theme-android .chat-wrap::before {
      content: '';

      right: -12px;

      z-index: 3;

        rgba(15, 15, 16, 0.08) 70%,
        rgba(15, 15, 16, 0.02) 90%,
        transparent 100%
      );

    .theme-ios .chat-wrap::before {

      left: -14px;
      right: -14px;
      top: 0;
      height: 112px;

      pointer-events: none;

        to bottom,
        rgba(0, 0, 0, 0.42) 0%,

      clear: both;
    }

    /*
      Android: время в одной строке с текстом (flex, nowrap).
      iOS: переопределено ниже — время в потоке сразу после текста (на последней строке под последним словом).
    */
    .bubble:not(.message--media) {
      display: flex;
      flex-wrap: nowrap;
      align-items: flex-end;
      justify-content: flex-start;
      column-gap: 8px;
      max-width: 100%;

    .bubble:not(.message--media) .bubble-text {
      flex: 1 1 auto;
      min-width: 0;
      max-width: calc(100% - 58px);
      word-break: break-word;
      font-weight: 400;
    }
    /* iOS: иначе flex+max-width режет строку ~до 27 символов */
    .theme-ios .bubble:not(.message--media) .bubble-text {
      max-width: none;
      flex: none;
    }
    .bubble:not(.message--media) .meta {
      float: none;
      clear: none;
      margin-top: 0;
      margin-left: 0;
      flex: 0 0 auto;
      align-self: flex-end;
      transform: translateY(2px);
    }
    .bubble:not(.message--media)::after {
      display: none;
    }

    /*
      iOS — классы bubble--ios-a … ios-e по длине текста ([...text].length):
      ios-a ≤35      — одна строка: весь текст и время
      ios-b 36–40    — текст одна строка (nowrap), время строкой ниже справа
      ios-c 41–75    — переносы; время в потоке после последнего слова (на последней строке текста)
      ios-d 76–80    — время снизу справа под блоком текста
      ios-e >80      — как ios-c
    */
    .theme-ios .bubble.bubble--ios-a:not(.message--media) {
      display: inline-flex !important;
      flex-direction: row;
      flex-wrap: nowrap;
      align-items: flex-end;
      justify-content: flex-start;
      column-gap: 7px;
      max-width: 100%;
      width: max-content;
      vertical-align: top;
    }
    .theme-ios .bubble.bubble--ios-a:not(.message--media) .bubble-text {
      display: block;
      flex: 0 1 auto;
      min-width: 0;
      white-space: nowrap;
      word-break: normal;
      overflow-wrap: normal;
      font-weight: 400;
    }
    .theme-ios .bubble.bubble--ios-a:not(.message--media) .meta {
      display: inline-flex;
      flex: 0 0 auto;
      align-self: flex-end;
      transform: translateY(3px);
      white-space: nowrap;
      margin-left: 0;
    }

    .theme-ios .bubble.bubble--ios-b:not(.message--media) {
      display: inline-flex !important;
      flex-direction: column;
      align-items: stretch;
      width: fit-content;
      max-width: 100%;
      vertical-align: top;
    }
    .theme-ios .bubble.bubble--ios-b:not(.message--media) .bubble-text {
      display: block;
      white-space: nowrap;
      word-break: normal;
      overflow-wrap: normal;

    }
    .theme-ios .bubble.bubble--ios-b:not(.message--media) .meta {

      margin-top: 4px;
      margin-left: 0;

    .theme-ios .bubble.bubble--ios-c:not(.message--media) {

    .theme-ios .bubble.bubble--ios-c:not(.message--media) .meta {

      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 12px;
    }
    .ios-input-placeholder {
      color: var(--tg-text-fade);
      flex: 1;
      min-width: 0;
    }
    .ios-input-icons {
      display: flex;
      align-items: center;
      gap: 10px;
      flex-shrink: 0;
      opacity: 0.88;
      line-height: 1;
    }
    .theme-ios .ios-input-icons .composer-tool-icon {
      width: 22px;
      height: 22px;
      opacity: 1;
    }
    .ios-mic.circle-button {
      width: 52px;
      height: 52px;
      border-radius: 50%;
      background: rgba(18, 18, 18, 0.88);
      backdrop-filter: blur(18px);
      -webkit-backdrop-filter: blur(18px);
      border: 1px solid rgba(255, 255, 255, 0.05);
      display: flex;
      align-items: center;
      justify-content: center;
      color: #fff;
      font-size: 22px;
      flex-shrink: 0;
    }
    /* Иконки композера: без CSS filter — у img+data URL в headless Chromium filter давал пустые квадраты */
    .composer-tool-icon {
      display: block;
      object-fit: contain;
      pointer-events: none;
    }
    .theme-ios .circle-button .composer-tool-icon {
      width: 22px;
      height: 22px;
      opacity: 0.95;
    }
    .theme-android .input-panel .input-action .composer-tool-icon {
      width: 24px;
      height: 24px;
      opacity: 0.92;
    }
    .theme-android .input-panel .voice-button .composer-tool-icon {
      width: 26px;
      height: 26px;
      opacity: 0.98;
    }
    .ios-home-indicator.home-indicator {
      height: 24px;
      background: var(--tg-bg);
      flex-shrink: 0;
      display: flex;
      align-items: center;
      justify-content: center;
      padding-bottom: 4px;
    }
    .ios-home-indicator.home-indicator::after {
      content: '';
      width: 140px;
      height: 5px;
      border-radius: 999px;
      background: rgba(255, 255, 255, 0.92);
    }
  </style>
</head>
<body>
  <div class="phone" id="phone">
    <div class="phone-main">
      <!-- Лента на весь фрейм; статус/шапка/закреп — отдельный слой поверх (сообщения уходят под «стекло») -->
      <div class="chat-wrap" id="chat"></div>

      <div class="phone-chrome theme-android-only">
        <div class="chrome-header-stack">
          <div class="status-bar">
            <span id="androidTime"></span>
            <div class="android-status-tray">
              <img class="status-tray-icon status-tray-signal" src="__ICON_SIGNAL__" alt="" width="30" height="18" decoding="async" aria-hidden="true" />
              <img class="status-tray-icon status-tray-wifi" src="__ICON_WIFI__" alt="" width="24" height="18" decoding="async" aria-hidden="true" />
              <span id="androidBattery"></span>
            </div>
          </div>
          <header class="telegram-header">
            <div class="back-button" aria-hidden="true">
              <span class="android-back-arrow">&#8592;</span>
              <span class="android-back-count" id="androidBackBadge" hidden></span>
            </div>
            <div class="chat-info">
              <div class="chat-avatar placeholder" id="androidAvatarPh"></div>
              <img class="chat-avatar" id="androidAvatarImg" alt="" style="display:none" />
              <div class="chat-meta">
                <div class="name" id="androidChatName"></div>
                <div class="status" id="androidChatStatus"></div>
              </div>
            </div>
            <div class="header-actions">
              <span class="header-actions-call" aria-hidden="true">
                <img
                  class="header-action-icon"
                  src="__ICON_PHONE__"
                  alt=""
                  width="22"
                  height="22"
                  decoding="async"
                />
              </span>
              <span aria-hidden="true">&#8942;</span>
            </div>
          </header>
        </div>
        <div class="pinned-container" id="androidPinnedWrap" hidden>
          <div class="pinned-message">
            <div class="pinned-left">
              <div class="pin-accent"></div>
              <div class="pin-text">
                <div class="title">Закреплённое сообщение</div>
                <div class="subtitle" id="androidPinnedSubtitle"></div>
              </div>
            </div>
          </div>
        </div>
      </div>

      <div class="phone-chrome theme-ios-only">
        <div class="chrome-header-stack">
          <div class="ios-status">
            <span class="ios-time" id="iosTime"></span>
            <div class="ios-island-wrap">
              <div class="ios-island" aria-hidden="true">Telegram</div>
            </div>
            <div class="ios-tray">
              <img class="status-tray-icon status-tray-signal" src="__ICON_SIGNAL__" alt="" width="30" height="18" decoding="async" aria-hidden="true" />
              <img class="status-tray-icon status-tray-wifi" src="__ICON_WIFI__" alt="" width="24" height="18" decoding="async" aria-hidden="true" />
              <div class="ios-battery-wrap" id="iosBatteryWrap" aria-hidden="true">
                <div class="ios-battery-body">
                  <div class="ios-battery-fill" aria-hidden="true"></div>
                  <span class="ios-battery-digit" id="iosBattery"></span>
                </div>
                <div class="ios-battery-nub" aria-hidden="true"></div>
              </div>
            </div>
          </div>
          <div class="ios-nav telegram-topbar">
            <div class="ios-nav-left theme-ios-only">
              <div class="ios-back back-pill" id="iosBack"></div>
            </div>
            <div class="ios-nav-mid">
              <div class="ios-title-pill user-pill">
                <div class="ios-title-line">
                  <span class="ios-nav-title" id="iosNavTitle"></span>
                </div>
                <div class="ios-nav-sub" id="iosNavSub"></div>
              </div>
            </div>
            <div class="ios-nav-right theme-ios-only">
              <div class="ios-nav-avatar user-avatar placeholder" id="iosNavAvatarPh"></div>
              <img class="ios-nav-avatar user-avatar" id="iosNavAvatarImg" alt="" style="display:none" />
            </div>
          </div>
        </div>
        <div class="ios-pinned-row" id="iosPinnedWrap" hidden>
          <div class="ios-pinned-inner pinned-message" id="iosPinnedInner"></div>
        </div>
      </div>
    </div>

    <div class="scroll-down theme-android-only" aria-hidden="true">&#8595;</div>

    <div class="input-panel theme-android-only">
      <div class="input-action">
        <img class="composer-tool-icon" src="__ICON_ATTACH__" alt="" width="24" height="24" decoding="async" />
      </div>
      <div class="message-input">Сообщение</div>
      <div class="input-action">
        <img class="composer-tool-icon" src="__ICON_SMILEY__" alt="" width="24" height="24" decoding="async" />
      </div>
      <div class="input-action" aria-hidden="true">&#127873;</div>
      <div class="voice-button">
        <img class="composer-tool-icon" src="__ICON_MIC__" alt="" width="24" height="24" decoding="async" />
      </div>
    </div>

    <div class="ios-composer-row message-input-bar theme-ios-only">
      <div class="ios-composer">
        <div class="ios-attach circle-button">
          <img class="composer-tool-icon" src="__ICON_ATTACH__" alt="" width="22" height="22" decoding="async" />
        </div>
        <div class="ios-input-fake message-input">
          <span class="ios-input-placeholder">Сообщение</span>
          <span class="ios-input-icons">
            <img class="composer-tool-icon" src="__ICON_SMILEY__" alt="" width="22" height="22" decoding="async" />
          </span>
        </div>
        <div class="ios-mic circle-button">
          <img class="composer-tool-icon" src="__ICON_MIC__" alt="" width="22" height="22" decoding="async" />
        </div>
      </div>
    </div>
    <div class="ios-home-indicator home-indicator theme-ios-only"></div>
  </div>
  <script type="application/json" id="scene-data">__SCENE_JSON__</script>
  <script>
    (function () {
      var el = document.getElementById('scene-data');
      var scene = JSON.parse(el.textContent);
      var platform = scene.platform === 'ios' ? 'ios' : 'android';
      var phone = document.getElementById('phone');
      phone.classList.add(platform === 'ios' ? 'theme-ios' : 'theme-android');

      var timeStr = scene.statusBar && scene.statusBar.time ? scene.statusBar.time : '';
      var battery = scene.statusBar && scene.statusBar.battery != null ? String(scene.statusBar.battery) : '';

      /** Только текст закреплённого сообщения (не подпись): макс. 36 символов + «…» */
      function truncatePinnedText(s) {
        if (s == null) return '';
        var str = String(s);
        return str.length <= 36 ? str : str.slice(0, 36) + '...';
      }

      if (platform === 'android') {
        document.getElementById('androidTime').textContent = timeStr;
        var tray = document.getElementById('androidBattery');
        if (battery) {
          tray.textContent = battery.indexOf('%') >= 0 ? battery : battery + '%';
        } else {
          tray.textContent = '';
        }

        var counterpartyA =
          scene.participants.find(function (p) {
            return p.side === 'left';
          }) || scene.participants[0];
        document.getElementById('androidChatName').textContent = counterpartyA
          ? counterpartyA.name
          : 'Чат';

        var headerMetaA = scene.header || {};
        var subA = typeof headerMetaA.subtitle === 'string' ? headerMetaA.subtitle : '';
        var stA = document.getElementById('androidChatStatus');
        if (subA) {
          stA.textContent = subA;
          stA.style.display = 'block';
        } else {
          stA.style.display = 'none';
        }

        var imgPhA = document.getElementById('androidAvatarPh');
        var imgElA = document.getElementById('androidAvatarImg');
        if (counterpartyA && counterpartyA.avatar) {
          imgElA.src = counterpartyA.avatar;
          imgElA.style.display = 'block';
          imgPhA.style.display = 'none';
        } else {
          imgElA.style.display = 'none';
          imgPhA.style.display = 'flex';
          imgPhA.textContent = counterpartyA && counterpartyA.name
            ? counterpartyA.name.charAt(0).toUpperCase()
            : '?';
        }

        var badgeA = headerMetaA.backBadge;
        var adb = document.getElementById('androidBackBadge');
        if (badgeA != null && String(badgeA) !== '') {
          adb.textContent = String(badgeA);
          adb.hidden = false;
        } else {
          adb.textContent = '';
          adb.hidden = true;
        }

        var pinnedA = scene.pinned && scene.pinned.text;
        var apw = document.getElementById('androidPinnedWrap');
        if (pinnedA) {
          apw.hidden = false;
          document.getElementById('androidPinnedSubtitle').textContent =
            truncatePinnedText(pinnedA);
        }
      } else {
        document.getElementById('iosTime').textContent = timeStr;
        var batEl = document.getElementById('iosBattery');
        var iosPct = Math.floor(Math.random() * 10) + 20;
        batEl.textContent = String(iosPct);
        var iosBatWrap = document.getElementById('iosBatteryWrap');
        if (iosBatWrap) {
          iosBatWrap.style.setProperty('--battery-pct', iosPct + '%');
        }

        var cp = scene.participants.find(function (p) { return p.side === 'left'; }) || scene.participants[0];
        document.getElementById('iosNavTitle').textContent = cp ? cp.name : 'Чат';

        var headerMeta = scene.header || {};
        var subEl = document.getElementById('iosNavSub');
        subEl.classList.remove('ios-nav-sub--online', 'ios-nav-sub--gray');
        var customSub =
          typeof headerMeta.subtitle === 'string' && headerMeta.subtitle.trim() !== ''
            ? headerMeta.subtitle.trim()
            : '';
        if (customSub) {
          subEl.textContent = customSub;
          if (/^онлайн$/i.test(customSub) || /^online$/i.test(customSub)) {
            subEl.classList.add('ios-nav-sub--online');
          } else {
            subEl.classList.add('ios-nav-sub--gray');
          }
        } else {
          if (Math.random() < 0.5) {
            subEl.textContent = 'в сети';
            subEl.classList.add('ios-nav-sub--online');
          } else {
            subEl.textContent = 'был(а) недавно';
            subEl.classList.add('ios-nav-sub--gray');
          }
        }
        subEl.style.display = 'block';

        var badge = headerMeta.backBadge;
        var backEl = document.getElementById('iosBack');
        var chev = '<span class="ios-chevron">&#8249;</span>';
        if (badge != null && badge !== '') {
          backEl.innerHTML =
            chev + '<span class="ios-unread-pill counter">' + escapeHtml(String(badge)) + '</span>';
        } else {
          backEl.innerHTML = chev;
        }

        var imgPh = document.getElementById('iosNavAvatarPh');
        var imgEl = document.getElementById('iosNavAvatarImg');
        if (cp && cp.avatar) {
          imgEl.src = cp.avatar;
          imgEl.style.display = 'block';
          imgPh.style.display = 'none';
        } else {
          imgEl.style.display = 'none';
          imgPh.style.display = 'flex';
          imgPh.textContent = cp && cp.name ? cp.name.charAt(0).toUpperCase() : '?';
        }

        var pinned = scene.pinned && scene.pinned.text;
        var pw = document.getElementById('iosPinnedWrap');
        if (pinned) {
          pw.hidden = false;
          document.getElementById('iosPinnedInner').innerHTML =
            '<span class="title">Закреплённое сообщение</span><span class="content">' +
            escapeHtml(truncatePinnedText(pinned)) +
            '</span><span class="ios-pin-icon" aria-hidden="true">\uD83D\uDCCC</span>';
        }
      }

      var msgItems = (scene.items || []).filter(function (it) {
        return it.type === 'text' || it.type === 'image';
      });
      var msgCount = msgItems.length;
      var hasPinText = !!(scene.pinned && scene.pinned.text);
      var underMode =
        hasPinText && msgCount > 9
          ? 'pinned'
          : !hasPinText && msgCount > 11
            ? 'header'
            : null;
      if (underMode) {
        phone.classList.add('chat-under-' + underMode);
      }

      var participants = {};
      (scene.participants || []).forEach(function (p) {
        participants[p.id] = p;
      });

      var chat = document.getElementById('chat');
      var outIdx = 0;

      (scene.items || []).forEach(function (item) {
        if (item.type === 'date') {
          var ds = document.createElement('div');
          ds.className = 'date-sep';
          var spanTag =
            platform === 'ios' || platform === 'android'
              ? '<span class="date-divider">' + escapeHtml(item.label || '') + '</span>'
              : '<span>' + escapeHtml(item.label || '') + '</span>';
          ds.innerHTML = spanTag;
          chat.appendChild(ds);
          return;
        }

        var part = participants[item.from];
        if (!part) return;
        var outgoing = part.side === 'right';

        var row = document.createElement('div');
        row.className = 'row ' + (outgoing ? 'out' : 'in');

        var col = document.createElement('div');
        col.className = 'bubble-col';

        var bubble = document.createElement('div');
        bubble.className = 'bubble';
        if (platform === 'ios' && outgoing && item.type === 'text') {
          bubble.classList.add(outIdx % 2 === 0 ? 'out-purple' : 'out-blue');
          outIdx++;
        }

        if (item.type === 'text') {
          var bubbleText = document.createElement('span');
          bubbleText.className = 'bubble-text';
          bubbleText.textContent = item.text || '';
          bubble.appendChild(bubbleText);
        } else if (item.type === 'image') {
          bubble.classList.add('message--media');
          var wrap = document.createElement('div');
          wrap.className = 'message__image-wrap';
          if (item.src) {
            var im = document.createElement('img');
            im.className = 'message__image';
            im.src = item.src;
            im.alt = '';
            wrap.appendChild(im);
          } else {
            var ph = document.createElement('div');
            ph.className = 'message__image-placeholder';
            ph.textContent = 'Изображение';
            wrap.appendChild(ph);
          }
          bubble.appendChild(wrap);
          if (item.caption) {
            var cap = document.createElement('div');
            cap.className = 'message__caption';
            cap.textContent = item.caption;
            bubble.appendChild(cap);
          }
          if (item.action != null && String(item.action).trim() !== '') {
            var act = document.createElement('div');
            act.className = 'message__action';
            act.textContent = String(item.action);
            bubble.appendChild(act);
          }
        }

        var meta = document.createElement('span');
        meta.className = 'meta';
        meta.appendChild(document.createTextNode(item.time || ''));
        if ((platform === 'ios' || platform === 'android') && outgoing) {
          var ck = document.createElement('span');
          ck.className = 'checks';
          ck.textContent = '\u2713\u2713';
          meta.appendChild(ck);
        }
        bubble.appendChild(meta);

        if (platform === 'ios' && item.type === 'text') {
          var iosLen = [...String(item.text || '')].length;
          var iosSeg =
            iosLen <= 35
              ? 'bubble--ios-a'
              : iosLen <= 40
                ? 'bubble--ios-b'
                : iosLen <= 75
                  ? 'bubble--ios-c'
                  : iosLen <= 80
                    ? 'bubble--ios-d'
                    : 'bubble--ios-e';
          bubble.classList.add(iosSeg);
        }

        col.appendChild(bubble);
        row.appendChild(col);

        chat.appendChild(row);
      });

      function escapeHtml(s) {
        var d = document.createElement('div');
        d.textContent = s;
        return d.innerHTML;
      }
    })();
  </script>
</body>
</html>
