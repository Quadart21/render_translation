<!DOCTYPE html>
<html lang="ru">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>chat-mock</title>
  <style>
    /* Вёрстка: templates/styles/chat-shared.css + chat-{ios|android}.css (сборка в render) */
    __IOS_FONT_FACES__
    __CHAT_CSS_SHARED__
    __CHAT_CSS_PLATFORM__
  </style>
</head>
<body>
  <div class="phone" id="phone">
    <div class="phone-main">
      <!-- Лента на весь фрейм; статус/шапка/закреп — отдельный слой поверх (сообщения уходят под «стекло») -->
      <div class="chat-wrap" id="chat"></div>

      <div class="phone-chrome theme-android-only">
        <div class="chrome-header-stack">
          <div class="status-bar">
            <span id="androidTime"></span>
            <div class="android-status-tray">
              <img class="status-tray-icon status-tray-signal" src="__ICON_SIGNAL__" alt="" width="30" height="18" decoding="async" aria-hidden="true" />
              <img class="status-tray-icon status-tray-wifi" src="__ICON_WIFI__" alt="" width="24" height="18" decoding="async" aria-hidden="true" />
              <span id="androidBattery"></span>
            </div>
          </div>
          <header class="telegram-header">
            <div class="back-button" aria-hidden="true">
              <span class="android-back-arrow">&#8592;</span>
              <span class="android-back-count" id="androidBackBadge" hidden></span>
            </div>
            <div class="chat-info">
              <div class="chat-avatar placeholder" id="androidAvatarPh"></div>
              <img class="chat-avatar" id="androidAvatarImg" alt="" style="display:none" />
              <div class="chat-meta">
                <div class="name" id="androidChatName"></div>
                <div class="status" id="androidChatStatus"></div>
              </div>
            </div>
            <div class="header-actions">
              <span class="header-actions-call" aria-hidden="true">
                <img
                  class="header-action-icon"
                  src="__ICON_PHONE__"
                  alt=""
                  width="22"
                  height="22"
                  decoding="async"
                />
              </span>
              <span aria-hidden="true">&#8942;</span>
            </div>
          </header>
        </div>
        <div class="pinned-container" id="androidPinnedWrap" hidden>
          <div class="pinned-message">
            <div class="pinned-left">
              <div class="pin-accent"></div>
              <div class="pin-text">
                <div class="title">Закреплённое сообщение</div>
                <div class="subtitle" id="androidPinnedSubtitle"></div>
              </div>
            </div>
          </div>
        </div>
      </div>

      <div class="phone-chrome theme-ios-only">
        <div class="chrome-header-stack">
          <div class="ios-status">
            <span class="ios-time" id="iosTime"></span>
            <div class="ios-island-wrap">
              <div class="ios-island" aria-hidden="true">
                <img class="ios-island-icon" src="__ICON_TELEGRAM__" alt="" width="12" height="12" decoding="async" />
                <span class="ios-island-label">TELEGRAM</span>
              </div>
            </div>
            <div class="ios-tray">
              <img class="status-tray-icon status-tray-signal" src="__ICON_SIGNAL__" alt="" width="30" height="18" decoding="async" aria-hidden="true" />
              <img class="status-tray-icon status-tray-wifi" src="__ICON_WIFI__" alt="" width="24" height="18" decoding="async" aria-hidden="true" />
              <div class="ios-battery-wrap" id="iosBatteryWrap" aria-hidden="true">
                <div class="ios-battery-body">
                  <div class="ios-battery-fill" aria-hidden="true"></div>
                  <span class="ios-battery-digit" id="iosBattery"></span>
                </div>
                <div class="ios-battery-nub" aria-hidden="true"></div>
              </div>
            </div>
          </div>
          <div class="ios-nav telegram-topbar">
            <div class="ios-nav-left theme-ios-only">
              <div class="ios-back back-pill" id="iosBack"></div>
            </div>
            <div class="ios-nav-mid">
              <div class="ios-title-pill user-pill">
                <div class="ios-title-pill-body">
                  <div class="ios-title-line">
                    <span class="ios-nav-title" id="iosNavTitle"></span>
                  </div>
                  <div class="ios-nav-sub" id="iosNavSub"></div>
                </div>
              </div>
            </div>
            <div class="ios-nav-right theme-ios-only">
              <div class="ios-nav-avatar user-avatar placeholder" id="iosNavAvatarPh"></div>
              <img class="ios-nav-avatar user-avatar" id="iosNavAvatarImg" alt="" style="display:none" />
            </div>
          </div>
        </div>
        <div class="ios-pinned-row" id="iosPinnedWrap" hidden>
          <div class="ios-pinned-inner pinned-message" id="iosPinnedInner"></div>
        </div>
      </div>

      <div class="ios-composer-row message-input-bar theme-ios-only">
        <div class="ios-composer">
          <div class="ios-attach circle-button">
            <img class="composer-tool-icon" src="__ICON_ATTACH__" alt="" width="22" height="22" decoding="async" />
          </div>
          <div class="ios-input-fake message-input">
            <span class="ios-input-placeholder">Сообщение</span>
            <span class="ios-input-icons">
              <img class="composer-tool-icon" src="__ICON_SMILEY__" alt="" width="22" height="22" decoding="async" />
            </span>
          </div>
          <div class="ios-mic circle-button">
            <img class="composer-tool-icon" src="__ICON_MIC__" alt="" width="22" height="22" decoding="async" />
          </div>
        </div>
      </div>
      <div class="ios-home-indicator home-indicator theme-ios-only"></div>
    </div>

    <div class="scroll-down theme-android-only" aria-hidden="true">&#8595;</div>

    <div class="input-panel theme-android-only">
      <div class="input-action">
        <img class="composer-tool-icon" src="__ICON_ATTACH__" alt="" width="24" height="24" decoding="async" />
      </div>
      <div class="message-input">Сообщение</div>
      <div class="input-action">
        <img class="composer-tool-icon" src="__ICON_SMILEY__" alt="" width="24" height="24" decoding="async" />
      </div>
      <div class="input-action" aria-hidden="true">&#127873;</div>
      <div class="voice-button">
        <img class="composer-tool-icon" src="__ICON_MIC__" alt="" width="24" height="24" decoding="async" />
      </div>
    </div>
  </div>
  <script type="application/json" id="scene-data">__SCENE_JSON__</script>
  <script>
    (function () {
      var el = document.getElementById('scene-data');
      var scene = JSON.parse(el.textContent);
      var platform = scene.platform === 'ios' ? 'ios' : 'android';
      var phone = document.getElementById('phone');
      phone.classList.add(platform === 'ios' ? 'theme-ios' : 'theme-android');
      /* Стили платформ разведены в файлах templates/styles/chat-ios.css и chat-android.css (в HTML попадает только один). */

      var timeStr = scene.statusBar && scene.statusBar.time ? scene.statusBar.time : '';
      var battery = scene.statusBar && scene.statusBar.battery != null ? String(scene.statusBar.battery) : '';

      /** Только текст закреплённого сообщения (не подпись): макс. 36 символов + «…» */
      function truncatePinnedText(s) {
        if (s == null) return '';
        var str = String(s);
        return str.length <= 36 ? str : str.slice(0, 36) + '...';
      }

      if (platform === 'android') {
        document.getElementById('androidTime').textContent = timeStr;
        var tray = document.getElementById('androidBattery');
        if (battery) {
          tray.textContent = battery.indexOf('%') >= 0 ? battery : battery + '%';
        } else {
          tray.textContent = '';
        }

        var counterpartyA =
          scene.participants.find(function (p) {
            return p.side === 'left';
          }) || scene.participants[0];
        document.getElementById('androidChatName').textContent = counterpartyA
          ? counterpartyA.name
          : 'Чат';

        var headerMetaA = scene.header || {};
        var subA = typeof headerMetaA.subtitle === 'string' ? headerMetaA.subtitle : '';
        var stA = document.getElementById('androidChatStatus');
        if (subA) {
          stA.textContent = subA;
          stA.style.display = 'block';
        } else {
          stA.style.display = 'none';
        }

        var imgPhA = document.getElementById('androidAvatarPh');
        var imgElA = document.getElementById('androidAvatarImg');
        if (counterpartyA && counterpartyA.avatar) {
          imgElA.src = counterpartyA.avatar;
          imgElA.style.display = 'block';
          imgPhA.style.display = 'none';
        } else {
          imgElA.style.display = 'none';
          imgPhA.style.display = 'flex';
          imgPhA.textContent = counterpartyA && counterpartyA.name
            ? counterpartyA.name.charAt(0).toUpperCase()
            : '?';
        }

        var badgeA = headerMetaA.backBadge;
        var adb = document.getElementById('androidBackBadge');
        if (badgeA != null && String(badgeA) !== '') {
          adb.textContent = String(badgeA);
          adb.hidden = false;
        } else {
          adb.textContent = '';
          adb.hidden = true;
        }

        var pinnedA = scene.pinned && scene.pinned.text;
        var apw = document.getElementById('androidPinnedWrap');
        if (pinnedA) {
          apw.hidden = false;
          document.getElementById('androidPinnedSubtitle').textContent =
            truncatePinnedText(pinnedA);
        }
      } else {
        document.getElementById('iosTime').textContent = timeStr;
        var batEl = document.getElementById('iosBattery');
        var iosPct = Math.floor(Math.random() * 10) + 20;
        batEl.textContent = String(iosPct);
        var iosBatWrap = document.getElementById('iosBatteryWrap');
        if (iosBatWrap) {
          iosBatWrap.style.setProperty('--battery-pct', iosPct + '%');
        }

        var cp = scene.participants.find(function (p) { return p.side === 'left'; }) || scene.participants[0];
        document.getElementById('iosNavTitle').textContent = cp ? cp.name : 'Чат';

        var headerMeta = scene.header || {};
        var subEl = document.getElementById('iosNavSub');
        subEl.classList.remove('ios-nav-sub--online', 'ios-nav-sub--gray');
        var customSub =
          typeof headerMeta.subtitle === 'string' && headerMeta.subtitle.trim() !== ''
            ? headerMeta.subtitle.trim()
            : '';
        if (customSub) {
          subEl.textContent = customSub;
          if (/^онлайн$/i.test(customSub) || /^online$/i.test(customSub)) {
            subEl.classList.add('ios-nav-sub--online');
          } else {
            subEl.classList.add('ios-nav-sub--gray');
          }
        } else {
          if (Math.random() < 0.5) {
            subEl.textContent = 'в сети';
            subEl.classList.add('ios-nav-sub--online');
          } else {
            subEl.textContent = 'был(а) недавно';
            subEl.classList.add('ios-nav-sub--gray');
          }
        }
        subEl.style.display = 'block';

        var badge = headerMeta.backBadge;
        var backEl = document.getElementById('iosBack');
        var chev = '<span class="ios-chevron">&#8249;</span>';
        if (badge != null && badge !== '') {
          backEl.innerHTML =
            chev +
            '<span class="ios-unread-pill counter"><span class="ios-unread-pill-inner">' +
            escapeHtml(String(badge)) +
            '</span></span>';
        } else {
          backEl.innerHTML = chev;
        }

        var imgPh = document.getElementById('iosNavAvatarPh');
        var imgEl = document.getElementById('iosNavAvatarImg');
        if (cp && cp.avatar) {
          imgEl.src = cp.avatar;
          imgEl.style.display = 'block';
          imgPh.style.display = 'none';
        } else {
          imgEl.style.display = 'none';
          imgPh.style.display = 'flex';
          imgPh.textContent = cp && cp.name ? cp.name.charAt(0).toUpperCase() : '?';
        }

        var pinned = scene.pinned && scene.pinned.text;
        var pw = document.getElementById('iosPinnedWrap');
        if (pinned) {
          pw.hidden = false;
          document.getElementById('iosPinnedInner').innerHTML =
            '<span class="title">Закреплённое сообщение</span><span class="content">' +
            escapeHtml(truncatePinnedText(pinned)) +
            '</span><span class="ios-pin-icon" aria-hidden="true">\uD83D\uDCCC</span>';
        }

        (function syncIosTitlePillPad() {
          var pill = document.querySelector('.ios-title-pill.user-pill');
          if (!pill) return;
          var inner = pill.querySelector('.ios-title-pill-body');
          if (!inner) return;
          function apply() {
            var w = inner.offsetWidth || inner.scrollWidth;
            var side = Math.round(w * 0.4);
            pill.style.setProperty('--ios-title-pill-hpad', Math.max(6, side) + 'px');
          }
          apply();
          requestAnimationFrame(function () {
            requestAnimationFrame(apply);
          });
        })();
      }

      var msgItems = (scene.items || []).filter(function (it) {
        return it.type === 'text' || it.type === 'image';
      });
      var msgCount = msgItems.length;
      var hasPinText = !!(scene.pinned && scene.pinned.text);
      var underMode =
        hasPinText && msgCount > 9
          ? 'pinned'
          : !hasPinText && msgCount > 11
            ? 'header'
            : null;
      if (underMode) {
        phone.classList.add('chat-under-' + underMode);
      }

      var participants = {};
      (scene.participants || []).forEach(function (p) {
        participants[p.id] = p;
      });

      var chat = document.getElementById('chat');
      var outIdx = 0;

      (scene.items || []).forEach(function (item) {
        if (item.type === 'date') {
          var ds = document.createElement('div');
          ds.className = 'date-sep';
          var spanTag =
            platform === 'ios' || platform === 'android'
              ? '<span class="date-divider">' + escapeHtml(item.label || '') + '</span>'
              : '<span>' + escapeHtml(item.label || '') + '</span>';
          ds.innerHTML = spanTag;
          chat.appendChild(ds);
          return;
        }

        var part = participants[item.from];
        if (!part) return;
        var outgoing = part.side === 'right';

        var row = document.createElement('div');
        row.className = 'row ' + (outgoing ? 'out' : 'in');

        var col = document.createElement('div');
        col.className = 'bubble-col';

        var bubble = document.createElement('div');
        bubble.className = 'bubble';
        var imageWrap = null;
        if (platform === 'ios' && outgoing && item.type === 'text') {
          bubble.classList.add(outIdx % 2 === 0 ? 'out-purple' : 'out-blue');
          outIdx++;
        }

        if (item.type === 'text') {
          var bubbleText = document.createElement('span');
          bubbleText.className = 'bubble-text';
          bubbleText.textContent = item.text || '';
          bubble.appendChild(bubbleText);
        } else if (item.type === 'image') {
          bubble.classList.add('message--media');
          var wrap = document.createElement('div');
          wrap.className = 'message__image-wrap';
          if (item.src) {
            var im = document.createElement('img');
            im.className = 'message__image';
            im.src = item.src;
            im.alt = '';
            wrap.appendChild(im);
          } else {
            var ph = document.createElement('div');
            ph.className = 'message__image-placeholder';
            ph.textContent = 'Изображение';
            wrap.appendChild(ph);
          }
          imageWrap = wrap;
          bubble.appendChild(wrap);
          if (item.caption) {
            var cap = document.createElement('div');
            cap.className = 'message__caption';
            cap.textContent = item.caption;
            bubble.appendChild(cap);
          }
          if (item.action != null && String(item.action).trim() !== '') {
            var act = document.createElement('div');
            act.className = 'message__action';
            act.textContent = String(item.action);
            bubble.appendChild(act);
          }
        }

        var meta = document.createElement('span');
        meta.className = 'meta';
        meta.appendChild(document.createTextNode(item.time || ''));
        if ((platform === 'ios' || platform === 'android') && outgoing) {
          var ck = document.createElement('span');
          ck.className = 'checks';
          ck.textContent = '\u2713\u2713';
          meta.appendChild(ck);
        }
        var hasImageCaption =
          item.type === 'image' && item.caption != null && String(item.caption).trim() !== '';
        if (item.type === 'image' && imageWrap && !hasImageCaption) {
          imageWrap.classList.add('message__image-wrap--overlay');
          imageWrap.appendChild(meta);
        } else {
          bubble.appendChild(meta);
        }

        if (platform === 'ios' && item.type === 'text') {
          var iosLen = [...String(item.text || '')].length;
          var iosSeg =
            iosLen <= 35
              ? 'bubble--ios-a'
              : iosLen <= 40
                ? 'bubble--ios-b'
                : iosLen <= 75
                  ? 'bubble--ios-c'
                  : iosLen <= 80
                    ? 'bubble--ios-d'
                    : 'bubble--ios-e';
          bubble.classList.add(iosSeg);
        }

        col.appendChild(bubble);
        row.appendChild(col);

        chat.appendChild(row);
      });

      function escapeHtml(s) {
        var d = document.createElement('div');
        d.textContent = s;
        return d.innerHTML;
      }
    })();
  </script>
</body>
</html>
