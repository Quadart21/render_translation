<!DOCTYPE html>
<html lang="ru">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>chat-mock — Android</title>
  <style>
    /* Только Android: полный CSS из templates/styles/chat-android.css (без SF Pro). */
    __CHAT_CSS__
  </style>
</head>
<body>
  <div class="phone theme-android" id="phone">
    <div class="phone-main">
      <div class="chat-wrap" id="chat"></div>

      <div class="phone-chrome">
        <div class="chrome-header-stack">
          <div class="status-bar">
            <span id="androidTime"></span>
            <div class="android-status-tray">
              <img class="status-tray-icon status-tray-signal" src="__ICON_SIGNAL__" alt="" width="30" height="18" decoding="async" aria-hidden="true" />
              <img class="status-tray-icon status-tray-wifi" src="__ICON_WIFI__" alt="" width="24" height="18" decoding="async" aria-hidden="true" />
              <span id="androidBattery"></span>
            </div>
          </div>
          <header class="telegram-header">
            <div class="back-button" aria-hidden="true">
              <span class="android-back-arrow">&#8592;</span>
              <span class="android-back-count" id="androidBackBadge" hidden></span>
            </div>
            <div class="chat-info">
              <div class="chat-avatar placeholder" id="androidAvatarPh"></div>
              <img class="chat-avatar" id="androidAvatarImg" alt="" style="display:none" />
              <div class="chat-meta">
                <div class="name" id="androidChatName"></div>
                <div class="status" id="androidChatStatus"></div>
              </div>
            </div>
            <div class="header-actions">
              <span class="header-actions-call" aria-hidden="true">
                <img
                  class="header-action-icon"
                  src="__ICON_PHONE__"
                  alt=""
                  width="22"
                  height="22"
                  decoding="async"
                />
              </span>
              <span aria-hidden="true">&#8942;</span>
            </div>
          </header>
        </div>
        <div class="pinned-container" id="androidPinnedWrap" hidden>
          <div class="pinned-message">
            <div class="pinned-left">
              <div class="pin-accent"></div>
              <div class="pin-text">
                <div class="title">Закреплённое сообщение</div>
                <div class="subtitle" id="androidPinnedSubtitle"></div>
              </div>
            </div>
          </div>
        </div>
      </div>
    </div>

    <div class="scroll-down" aria-hidden="true">&#8595;</div>

    <div class="input-panel">
      <div class="input-action clip-btn">
        <img class="composer-tool-icon" src="__ICON_ATTACH__" alt="" width="24" height="24" decoding="async" />
      </div>
      <div class="message-input">Сообщение</div>
      <div class="input-action emoji-btn">
        <img class="composer-tool-icon" src="__ICON_SMILEY__" alt="" width="24" height="24" decoding="async" />
      </div>
      <div class="input-action gift-btn" aria-hidden="true">
        <svg
          class="gift-icon-svg"
          width="57"
          height="64"
          viewBox="0 0 57 64"
          xmlns="http://www.w3.org/2000/svg"
        >
          <g transform="translate(1 1)" fill="none" fill-rule="evenodd" stroke="currentColor" stroke-width="2">
            <path d="M53,32.1 L53,59.7 C53,61 52,62 50.7,62 L4.4,62 C3.1,62 2.1,61 2.1,59.7 L2.1,32.1"></path>
            <path d="M55,29.7 C55,31 54,32 52.7,32 L2.3,32 C1,32 0,31 0,29.7 L0,19.4 C0,18.1 1,17.1 2.3,17.1 L52.7,17.1 C54,17.1 55,18.1 55,19.4 L55,29.7 Z"></path>
            <path d="M42.3,9.8 C40.1,12 30.1,18.4 27.8,16.2 C25.6,14 32,3.9 34.2,1.7 C36.4,-0.5 40,-0.5 42.3,1.7 C44.5,3.9 44.5,7.6 42.3,9.8 Z"></path>
            <path d="M12.6,9.8 C14.8,12 24.9,18.5 27.1,16.3 C29.3,14.1 22.9,4 20.6,1.8 C18.4,-0.4 14.8,-0.4 12.6,1.8 C10.4,3.9 10.4,7.5 12.6,9.8 Z"></path>
            <path d="M20.6,25.2 C20.6,25.2 22.1,20.6 27.9,18.3 L27.9,61.9"></path>
            <path d="M27.5,18.4 C27.5,18.4 29.8,26.4 37.8,27.6"></path>
          </g>
        </svg>
      </div>
      <div class="voice-button">
        <img class="composer-tool-icon" src="__ICON_MIC__" alt="" width="24" height="24" decoding="async" />
      </div>
    </div>
  </div>
  <script type="application/json" id="scene-data">__SCENE_JSON__</script>
  <script>
    (function () {
      function escapeHtml(s) {
        var d = document.createElement('div');
        d.textContent = s;
        return d.innerHTML;
      }

      var el = document.getElementById('scene-data');
      var scene = JSON.parse(el.textContent);
      if (scene.platform !== 'android') return;

      var phone = document.getElementById('phone');

      var timeStr = scene.statusBar && scene.statusBar.time ? scene.statusBar.time : '';
      var battery = scene.statusBar && scene.statusBar.battery != null ? String(scene.statusBar.battery) : '';

      function truncatePinnedText(s) {
        if (s == null) return '';
        var str = String(s);
        return str.length <= 36 ? str : str.slice(0, 36) + '...';
      }

      document.getElementById('androidTime').textContent = timeStr;
      var tray = document.getElementById('androidBattery');
      if (battery) {
        tray.textContent = battery.indexOf('%') >= 0 ? battery : battery + '%';
      } else {
        tray.textContent = '';
      }

      var counterpartyA =
        scene.participants.find(function (p) {
          return p.side === 'left';
        }) || scene.participants[0];
      document.getElementById('androidChatName').textContent = counterpartyA
        ? counterpartyA.name
        : 'Чат';

      var headerMetaA = scene.header || {};
      var subA = typeof headerMetaA.subtitle === 'string' ? headerMetaA.subtitle : '';
      var stA = document.getElementById('androidChatStatus');
      if (subA) {
        stA.textContent = subA;
        stA.style.display = 'block';
      } else {
        stA.style.display = 'none';
      }

      var imgPhA = document.getElementById('androidAvatarPh');
      var imgElA = document.getElementById('androidAvatarImg');
      if (counterpartyA && counterpartyA.avatar) {
        imgElA.src = counterpartyA.avatar;
        imgElA.style.display = 'block';
        imgPhA.style.display = 'none';
      } else {
        imgElA.style.display = 'none';
        imgPhA.style.display = 'flex';
        imgPhA.textContent =
          counterpartyA && counterpartyA.name ? counterpartyA.name.charAt(0).toUpperCase() : '?';
      }

      var badgeA = headerMetaA.backBadge;
      var adb = document.getElementById('androidBackBadge');
      if (badgeA != null && String(badgeA) !== '') {
        adb.textContent = String(badgeA);
        adb.hidden = false;
      } else {
        adb.textContent = '';
        adb.hidden = true;
      }

      var pinnedA = scene.pinned && scene.pinned.text;
      var apw = document.getElementById('androidPinnedWrap');
      if (pinnedA) {
        apw.hidden = false;
        document.getElementById('androidPinnedSubtitle').textContent = truncatePinnedText(pinnedA);
      }

      var msgItems = (scene.items || []).filter(function (it) {
        return it.type === 'text' || it.type === 'image';
      });
      var msgCount = msgItems.length;
      var hasPinText = !!(scene.pinned && scene.pinned.text);
      var underMode =
        hasPinText && msgCount > 9
          ? 'pinned'
          : !hasPinText && msgCount > 11
            ? 'header'
            : null;
      if (underMode) {
        phone.classList.add('chat-under-' + underMode);
      }

      var participants = {};
      (scene.participants || []).forEach(function (p) {
        participants[p.id] = p;
      });

      var chat = document.getElementById('chat');

      function hexToRgb(hex) {
        var h = hex.replace('#', '');
        return {
          r: parseInt(h.slice(0, 2), 16),
          g: parseInt(h.slice(2, 4), 16),
          b: parseInt(h.slice(4, 6), 16),
        };
      }
      function lerpHex(a, b, t) {
        var A = hexToRgb(a);
        var B = hexToRgb(b);
        var r = Math.round(A.r + (B.r - A.r) * t);
        var g = Math.round(A.g + (B.g - A.g) * t);
        var bl = Math.round(A.b + (B.b - A.b) * t);
        return (
          '#' +
          [r, g, bl]
            .map(function (x) {
              return ('0' + Math.max(0, Math.min(255, x)).toString(16)).slice(-2);
            })
            .join('')
        );
      }

      function applyOutgoingBubbleVerticalGradient() {
        var purple = '#964BEC';
        var blue = '#3F66FF';
        var bubbles = chat.querySelectorAll('.row.out .bubble:not(.message--media)');
        if (!bubbles.length) return;
        var centers = [];
        for (var i = 0; i < bubbles.length; i++) {
          var row = bubbles[i].closest('.row');
          centers.push(row ? row.offsetTop + row.offsetHeight / 2 : 0);
        }
        var minY = Math.min.apply(null, centers);
        var maxY = Math.max.apply(null, centers);
        var span = maxY - minY;
        var angle = '165deg';
        for (var j = 0; j < bubbles.length; j++) {
          var rowJ = bubbles[j].closest('.row');
          var cy = rowJ ? rowJ.offsetTop + rowJ.offsetHeight / 2 : minY;
          var t = span <= 0 ? 1 : (cy - minY) / span;
          var c1 = lerpHex(purple, blue, t);
          var c2 = lerpHex(purple, blue, Math.min(1, t + 0.1));
          bubbles[j].style.background = 'linear-gradient(' + angle + ', ' + c1 + ', ' + c2 + ')';
        }
      }
      window.applyOutgoingBubbleVerticalGradient = applyOutgoingBubbleVerticalGradient;

      function sampleImageCornerIsLight(img, cb) {
        function run() {
          try {
            var w = img.naturalWidth || img.width;
            var h = img.naturalHeight || img.height;
            if (!w || !h) {
              cb(false);
              return;
            }
            var canvas = document.createElement('canvas');
            var ctx = canvas.getContext('2d');
            if (!ctx) {
              cb(false);
              return;
            }
            var dw = 28;
            var dh = 28;
            canvas.width = dw;
            canvas.height = dh;
            var sx = Math.max(0, Math.floor(w * 0.4));
            var sy = Math.max(0, Math.floor(h * 0.5));
            var sw = w - sx;
            var sh = h - sy;
            if (sw < 2 || sh < 2) {
              cb(false);
              return;
            }
            ctx.drawImage(img, sx, sy, sw, sh, 0, 0, dw, dh);
            var data = ctx.getImageData(0, 0, dw, dh).data;
            var sum = 0;
            var n = 0;
            for (var i = 0; i < data.length; i += 4) {
              var r = data[i];
              var g = data[i + 1];
              var b = data[i + 2];
              var a = data[i + 3];
              if (a < 12) continue;
              sum += 0.2126 * r + 0.7152 * g + 0.0722 * b;
              n++;
            }
            if (!n) {
              cb(false);
              return;
            }
            cb(sum / n > 176);
          } catch (err) {
            cb(false);
          }
        }
        if (img.complete && img.naturalWidth) {
          run();
        } else {
          img.addEventListener('load', run, { once: true });
          img.addEventListener(
            'error',
            function () {
              cb(false);
            },
            { once: true }
          );
        }
      }

      function applyLightImageOverlayMeta() {
        var wraps = document.querySelectorAll('.message__image-wrap.message__image-wrap--overlay');
        for (var i = 0; i < wraps.length; i++) {
          (function (wrap) {
            var img = wrap.querySelector('img.message__image');
            if (!img) return;
            sampleImageCornerIsLight(img, function (light) {
              if (light) wrap.classList.add('message__image-wrap--light-bg');
              else wrap.classList.remove('message__image-wrap--light-bg');
            });
          })(wraps[i]);
        }
      }
      window.applyLightImageOverlayMeta = applyLightImageOverlayMeta;

      (scene.items || []).forEach(function (item) {
        if (item.type === 'date') {
          var ds = document.createElement('div');
          ds.className = 'date-sep';
          ds.innerHTML =
            '<span class="date-divider">' + escapeHtml(item.label || '') + '</span>';
          chat.appendChild(ds);
          return;
        }

        var part = participants[item.from];
        if (!part) return;
        var outgoing = part.side === 'right';

        var row = document.createElement('div');
        row.className = 'row ' + (outgoing ? 'out' : 'in');

        var col = document.createElement('div');
        col.className = 'bubble-col';

        var bubble = document.createElement('div');
        bubble.className = 'bubble';
        var imageWrap = null;

        if (item.type === 'text') {
          var bubbleText = document.createElement('span');
          bubbleText.className = 'bubble-text';
          bubbleText.textContent = item.text || '';
          bubble.appendChild(bubbleText);
        } else if (item.type === 'image') {
          bubble.classList.add('message--media');
          var wrap = document.createElement('div');
          wrap.className = 'message__image-wrap';
          if (item.src) {
            var im = document.createElement('img');
            im.className = 'message__image';
            im.src = item.src;
            im.alt = '';
            wrap.appendChild(im);
          } else {
            var ph = document.createElement('div');
            ph.className = 'message__image-placeholder';
            ph.textContent = 'Изображение';
            wrap.appendChild(ph);
          }
          imageWrap = wrap;
          bubble.appendChild(wrap);
          if (item.caption) {
            var cap = document.createElement('div');
            cap.className = 'message__caption';
            cap.textContent = item.caption;
            bubble.appendChild(cap);
          }
          if (item.action != null && String(item.action).trim() !== '') {
            var act = document.createElement('div');
            act.className = 'message__action';
            act.textContent = String(item.action);
            bubble.appendChild(act);
          }
        }

        var meta = document.createElement('span');
        meta.className = 'meta';
        meta.appendChild(document.createTextNode(item.time || ''));
        if (outgoing) {
          var ck = document.createElement('span');
          ck.className = 'checks';
          var ckImg = document.createElement('img');
          ckImg.className = 'checks-img';
          ckImg.src = '__MESSAGE_CHECKS_SRC__';
          ckImg.alt = '';
          ckImg.decoding = 'async';
          ckImg.setAttribute('aria-hidden', 'true');
          ck.appendChild(ckImg);
          meta.appendChild(ck);
        }
        var hasImageCaption =
          item.type === 'image' && item.caption != null && String(item.caption).trim() !== '';
        if (item.type === 'image' && imageWrap && !hasImageCaption) {
          imageWrap.classList.add('message__image-wrap--overlay');
          imageWrap.appendChild(meta);
        } else {
          bubble.appendChild(meta);
        }

        col.appendChild(bubble);
        row.appendChild(col);

        chat.appendChild(row);
      });

      applyOutgoingBubbleVerticalGradient();
      applyLightImageOverlayMeta();
      requestAnimationFrame(function () {
        requestAnimationFrame(function () {
          applyOutgoingBubbleVerticalGradient();
          applyLightImageOverlayMeta();
        });
      });
      window.addEventListener('load', function () {
        applyOutgoingBubbleVerticalGradient();
        applyLightImageOverlayMeta();
      });
    })();
  </script>
</body>
</html>
