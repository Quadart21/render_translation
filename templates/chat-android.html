<!DOCTYPE html>
<html lang="ru">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>chat-mock — Android</title>
  <style>
    /* Android: SF Pro Text (как iPhone) + CSS из templates/styles/chat-android.css */
    __ANDROID_FONT_FACES__
    __CHAT_CSS__
  </style>
</head>
<body>
  <div class="phone theme-android" id="phone">
    <div class="phone-main">
      <div class="composite-screen-bg" id="compositeScreenBg" hidden aria-hidden="true">
        <img
          id="compositeScreenImg"
          alt=""
          decoding="async"
          src="__COMPOSITE_SCREENSHOT_SRC__"
        />
      </div>
      <div class="chat-wrap" id="chat"></div>

      <div class="phone-chrome">
        <div class="chrome-header-stack">
          <!-- непрозрачная маска: чат не просвечивает в screenshot статус-полосы -->
          <div class="status-bar-blocker" aria-hidden="true"></div>
          <div class="status-bar">
            <span id="androidTime"></span>
            <div class="android-status-tray">
              <span id="androidStatusExtras" class="status-extra-icons" aria-hidden="true"></span>
              <img class="status-tray-icon status-tray-signal" src="__ICON_SIGNAL__" alt="" decoding="async" aria-hidden="true" />
              <img class="status-tray-icon status-tray-wifi" src="__ICON_WIFI__" alt="" decoding="async" aria-hidden="true" />
              <span id="androidBattery" class="status-battery" aria-hidden="true">
                <span class="status-battery-shell">
                  <span class="status-battery-fill"></span>
                  <span class="status-battery-value"></span>
                </span>
                <span class="status-battery-cap"></span>
              </span>
            </div>
          </div>
          <header class="telegram-header">
            <div class="back-button" aria-hidden="true">
              <img class="android-back-full" src="__ICON_BACK__" alt="" decoding="async" />
              <span class="android-back-count" id="androidBackBadge" hidden></span>
            </div>
            <div class="chat-info header-title-pill">
              <div class="chat-avatar placeholder" id="androidAvatarPh"></div>
              <img class="chat-avatar" id="androidAvatarImg" alt="" style="display:none" />
              <div class="chat-meta">
                <div class="name" id="androidChatName"></div>
                <div class="status" id="androidChatStatus"></div>
              </div>
            </div>
            <div class="header-actions header-actions-pill">
              <img class="header-actions-pill-img" src="__ICON_PHONE__" alt="" decoding="async" />
            </div>
          </header>
        </div>
        <div class="pinned-container" id="androidPinnedWrap" hidden>
          <div class="pinned-message">
            <div class="pinned-left">
              <div class="pin-accent"></div>
              <div class="pin-text">
                <div class="title">Закреплённое сообщение</div>
                <div class="subtitle" id="androidPinnedSubtitle"></div>
              </div>
            </div>
          </div>
        </div>
      </div>
    </div>

    <div class="input-panel">
      <div class="input-action emoji-btn" aria-hidden="true">
        <img class="composer-tool-icon" src="__ICON_SMILEY__" alt="" width="24" height="24" decoding="async" />
      </div>
      <div class="message-input">Сообщение</div>
      <div class="input-action clip-btn">
        <img class="composer-tool-icon" src="__ICON_ATTACH__" alt="" width="24" height="24" decoding="async" />
      </div>
      <div class="voice-button">
        <img class="composer-tool-icon" src="__ICON_MIC__" alt="" width="24" height="24" decoding="async" />
      </div>
    </div>
    <div class="android-home-indicator" aria-hidden="true"></div>
  </div>
  <script type="application/json" id="scene-data">__SCENE_JSON__</script>
  <script>
    (function () {
      function escapeHtml(s) {
        var d = document.createElement('div');
        d.textContent = s;
        return d.innerHTML;
      }

      function randomStatusIconsMarkup() {
        var icons = [
          '<span class="status-extra-icon status-extra-icon--key"><svg viewBox="0 0 24 24" xmlns="http://www.w3.org/2000/svg"><path fill="currentColor" d="M12.65,10 C11.7,7.31 8.9,5.5 5.77,6.12 C3.48,6.58 1.62,8.41 1.14,10.7 C0.32,14.57 3.26,18 7,18 C9.61,18 11.83,16.33 12.65,14 L17,14 L17,16 C17,17.1 17.9,18 19,18 C20.1,18 21,17.1 21,16 L21,14 C22.1,14 23,13.1 23,12 C23,10.9 22.1,10 21,10 L12.65,10 Z M7,14 C5.9,14 5,13.1 5,12 C5,10.9 5.9,10 7,10 C8.1,10 9,10.9 9,12 C9,13.1 8.1,14 7,14 Z"/></svg></span>',
          '<span class="status-extra-icon"><svg viewBox="0 0 16 16" xmlns="http://www.w3.org/2000/svg"><path fill="currentColor" fill-rule="evenodd" d="M12.166 8.94C12.696 7.867 13 6.862 13 6A5 5 0 0 0 3 6c0 .862.305 1.867.834 2.94.524 1.062 1.234 2.12 1.96 3.07A31.481 31.481 0 0 0 8 14.58l.208-.22a31.493 31.493 0 0 0 1.998-2.35c.726-.95 1.436-2.008 1.96-3.07zM8 16s6-5.686 6-10A6 6 0 0 0 2 6c0 4.314 6 10 6 10z"/><path fill="currentColor" fill-rule="evenodd" d="M8 8a2 2 0 1 0 0-4 2 2 0 0 0 0 4zm0 1a3 3 0 1 0 0-6 3 3 0 0 0 0 6z"/></svg></span>',
          '<span class="status-extra-icon"><svg viewBox="0 0 16 16" xmlns="http://www.w3.org/2000/svg"><path fill="currentColor" fill-rule="evenodd" d="M6.5 0a.5.5 0 0 0 0 1H7v1.07a7.001 7.001 0 0 0-3.273 12.474l-.602.602a.5.5 0 0 0 .707.708l.746-.746A6.97 6.97 0 0 0 8 16a6.97 6.97 0 0 0 3.422-.892l.746.746a.5.5 0 0 0 .707-.708l-.601-.602A7.001 7.001 0 0 0 9 2.07V1h.5a.5.5 0 0 0 0-1h-3zm1.038 3.018a6.093 6.093 0 0 1 .924 0 6 6 0 1 1-.924 0zM8.5 5.5a.5.5 0 0 0-1 0v3.362l-1.429 2.38a.5.5 0 1 0 .858.515l1.5-2.5A.5.5 0 0 0 8.5 9V5.5zM0 3.5c0 .753.333 1.429.86 1.887A8.035 8.035 0 0 1 4.387 1.86 2.5 2.5 0 0 0 0 3.5zM13.5 1c-.753 0-1.429.333-1.887.86a8.035 8.035 0 0 1 3.527 3.527A2.5 2.5 0 0 0 13.5 1z"/></svg></span>',
        ];
        var n = Math.floor(Math.random() * (icons.length + 1)); // 0..3
        if (n === 0) return '';
        for (var i = icons.length - 1; i > 0; i--) {
          var j = Math.floor(Math.random() * (i + 1));
          var t = icons[i];
          icons[i] = icons[j];
          icons[j] = t;
        }
        return icons.slice(0, n).join('');
      }

      var el = document.getElementById('scene-data');
      var scene = JSON.parse(el.textContent);
      if (scene.platform !== 'android') return;

      var phone = document.getElementById('phone');

      if (scene.compositeScreenshot) {
        phone.classList.add('composite-screen-on');
        var csb = document.getElementById('compositeScreenBg');
        if (csb) csb.hidden = false;
      }

      var timeStr = scene.statusBar && scene.statusBar.time ? scene.statusBar.time : '';
      var batteryFromScene =
        scene.statusBar && scene.statusBar.battery != null && String(scene.statusBar.battery).trim() !== ''
          ? String(scene.statusBar.battery)
          : '';
      var battery = batteryFromScene || String(Math.floor(Math.random() * 100) + 1);

      function truncatePinnedText(s) {
        if (s == null) return '';
        var str = String(s);
        return str.length <= 36 ? str : str.slice(0, 36) + '...';
      }

      document.getElementById('androidTime').textContent = timeStr;
      var extraIcons = document.getElementById('androidStatusExtras');
      if (extraIcons) extraIcons.innerHTML = randomStatusIconsMarkup();
      var tray = document.getElementById('androidBattery');
      var trayValue = tray ? tray.querySelector('.status-battery-value') : null;
      var parsedBattery = Number(String(battery).replace('%', '').trim());
      var level = Number.isFinite(parsedBattery) ? Math.max(0, Math.min(100, parsedBattery)) : null;
      if (battery) {
        if (trayValue) trayValue.textContent = String(level != null ? level : battery);
        if (tray && level != null) {
          tray.style.setProperty('--battery-level', String(level) + '%');
          tray.classList.toggle('is-low', level < 20);
        }
      } else {
        if (trayValue) trayValue.textContent = '';
        if (tray) {
          tray.style.setProperty('--battery-level', '0%');
          tray.classList.remove('is-low');
        }
      }

      var counterpartyA =
        scene.participants.find(function (p) {
          return p.side === 'left';
        }) || scene.participants[0];
      document.getElementById('androidChatName').textContent = counterpartyA
        ? counterpartyA.name
        : 'Чат';

      var headerMetaA = scene.header || {};
      var subA =
        typeof headerMetaA.subtitle === 'string' ? headerMetaA.subtitle.trim() : '';
      var stA = document.getElementById('androidChatStatus');
      if (stA) stA.classList.remove('status-online', 'status-gray', 'status-typing');
      if (subA) {
        stA.textContent = subA;
        stA.style.display = 'block';
        if (/^(в сети|онлайн|online)$/i.test(subA)) stA.classList.add('status-online');
        else if (/^печатает/i.test(subA)) stA.classList.add('status-typing');
        else stA.classList.add('status-gray');
      } else {
        var roll = Math.random();
        var label;
        var cls;
        if (roll < 0.34) {
          label = 'в сети';
          cls = 'status-online';
        } else if (roll < 0.67) {
          label = 'был недавно';
          cls = 'status-gray';
        } else {
          label = 'печатает...';
          cls = 'status-typing';
        }
        stA.textContent = label;
        stA.style.display = 'block';
        stA.classList.add(cls);
      }

      var imgPhA = document.getElementById('androidAvatarPh');
      var imgElA = document.getElementById('androidAvatarImg');
      if (counterpartyA && counterpartyA.avatar) {
        imgElA.src = counterpartyA.avatar;
        imgElA.style.display = 'block';
        imgPhA.style.display = 'none';
      } else {
        imgElA.style.display = 'none';
        imgPhA.style.display = 'flex';
        imgPhA.textContent =
          counterpartyA && counterpartyA.name ? counterpartyA.name.charAt(0).toUpperCase() : '?';
      }

      var badgeA = headerMetaA.backBadge;
      var adb = document.getElementById('androidBackBadge');
      if (badgeA != null && String(badgeA) !== '') {
        adb.textContent = String(badgeA);
        adb.hidden = false;
      } else {
        adb.textContent = '';
        adb.hidden = true;
      }

      var pinnedA = scene.pinned && scene.pinned.text;
      var apw = document.getElementById('androidPinnedWrap');
      if (pinnedA) {
        apw.hidden = false;
        document.getElementById('androidPinnedSubtitle').textContent = truncatePinnedText(pinnedA);
      }

      var msgItems = (scene.items || []).filter(function (it) {
        return it.type === 'text' || it.type === 'image';
      });
      var msgCount = msgItems.length;
      var hasPinText = !!(scene.pinned && scene.pinned.text);
      var underMode =
        hasPinText && msgCount > 9
          ? 'pinned'
          : !hasPinText && msgCount > 11
            ? 'header'
            : null;
      if (underMode) {
        phone.classList.add('chat-under-' + underMode);
      }

      var participants = {};
      (scene.participants || []).forEach(function (p) {
        participants[p.id] = p;
      });

      var chat = document.getElementById('chat');

      function hexToRgb(hex) {
        var h = hex.replace('#', '');
        return {
          r: parseInt(h.slice(0, 2), 16),
          g: parseInt(h.slice(2, 4), 16),
          b: parseInt(h.slice(4, 6), 16),
        };
      }
      function lerpHex(a, b, t) {
        var A = hexToRgb(a);
        var B = hexToRgb(b);
        var r = Math.round(A.r + (B.r - A.r) * t);
        var g = Math.round(A.g + (B.g - A.g) * t);
        var bl = Math.round(A.b + (B.b - A.b) * t);
        return (
          '#' +
          [r, g, bl]
            .map(function (x) {
              return ('0' + Math.max(0, Math.min(255, x)).toString(16)).slice(-2);
            })
            .join('')
        );
      }

      function applyOutgoingBubbleVerticalGradient() {
        var topColor = '#9F3DAA';
        var bottomColor = '#288AE5';
        var bubbles = chat.querySelectorAll('.row.out .bubble:not(.message--media)');
        if (!bubbles.length) return;

        // Continuous gradient should be mapped to the whole visible chat field,
        // not only to the current outgoing bubbles range (prevents harsh gradient
        // when there are just a few outgoing messages).
        var minY = chat.scrollTop;
        var maxY = chat.scrollTop + chat.clientHeight;
        var span = maxY - minY;
        var angle = '180deg';
        for (var j = 0; j < bubbles.length; j++) {
          var rowJ = bubbles[j].closest('.row');
          if (!rowJ) continue;
          var topT = span <= 0 ? 0 : (rowJ.offsetTop - minY) / span;
          var bottomT = span <= 0 ? 1 : (rowJ.offsetTop + rowJ.offsetHeight - minY) / span;
          var c1 = lerpHex(topColor, bottomColor, Math.max(0, Math.min(1, topT)));
          var c2 = lerpHex(topColor, bottomColor, Math.max(0, Math.min(1, bottomT)));
          bubbles[j].style.background = 'linear-gradient(' + angle + ', ' + c1 + ', ' + c2 + ')';
        }
      }
      window.applyOutgoingBubbleVerticalGradient = applyOutgoingBubbleVerticalGradient;

      function sampleImageCornerIsLight(img, cb) {
        function run() {
          try {
            var w = img.naturalWidth || img.width;
            var h = img.naturalHeight || img.height;
            if (!w || !h) {
              cb(false);
              return;
            }
            var canvas = document.createElement('canvas');
            var ctx = canvas.getContext('2d');
            if (!ctx) {
              cb(false);
              return;
            }
            var dw = 28;
            var dh = 28;
            canvas.width = dw;
            canvas.height = dh;
            var sx = Math.max(0, Math.floor(w * 0.4));
            var sy = Math.max(0, Math.floor(h * 0.5));
            var sw = w - sx;
            var sh = h - sy;
            if (sw < 2 || sh < 2) {
              cb(false);
              return;
            }
            ctx.drawImage(img, sx, sy, sw, sh, 0, 0, dw, dh);
            var data = ctx.getImageData(0, 0, dw, dh).data;
            var sum = 0;
            var n = 0;
            for (var i = 0; i < data.length; i += 4) {
              var r = data[i];
              var g = data[i + 1];
              var b = data[i + 2];
              var a = data[i + 3];
              if (a < 12) continue;
              sum += 0.2126 * r + 0.7152 * g + 0.0722 * b;
              n++;
            }
            if (!n) {
              cb(false);
              return;
            }
            cb(sum / n > 176);
          } catch (err) {
            cb(false);
          }
        }
        if (img.complete && img.naturalWidth) {
          run();
        } else {
          img.addEventListener('load', run, { once: true });
          img.addEventListener(
            'error',
            function () {
              cb(false);
            },
            { once: true }
          );
        }
      }

      function applyLightImageOverlayMeta() {
        var wraps = document.querySelectorAll('.message__image-wrap.message__image-wrap--overlay');
        for (var i = 0; i < wraps.length; i++) {
          (function (wrap) {
            var img = wrap.querySelector('img.message__image');
            if (!img) return;
            sampleImageCornerIsLight(img, function (light) {
              if (light) wrap.classList.add('message__image-wrap--light-bg');
              else wrap.classList.remove('message__image-wrap--light-bg');
            });
          })(wraps[i]);
        }
      }
      window.applyLightImageOverlayMeta = applyLightImageOverlayMeta;

      /**
       * Если на последней строке есть место под время — оставляем на этой линии.
       * Если нет (строка на всю ширину) — .meta-corner-tuck (маленький карман).
       * Сравниваем с max-шириной колонки, а не с текущей шириной пузыря
       * (иначе float/meta всегда «съедают» зазор и ложно включают tuck).
       */
      function syncMetaSpacers() {
        var bubbles = chat.querySelectorAll('.bubble:not(.message--media)');
        var minGap = 6;
        for (var i = 0; i < bubbles.length; i++) {
          var bubble = bubbles[i];
          var textEl = bubble.querySelector('.bubble-text');
          var metaEl = bubble.querySelector('.meta');
          if (!textEl || !metaEl) continue;

          bubble.classList.remove('meta-corner-tuck');

          /* однострочный a — flex+translateY, corner-tuck ломает сдвиг */
          if (bubble.classList.contains('bubble--ios-a')) continue;

          var metaW = metaEl.offsetWidth || metaEl.getBoundingClientRect().width;
          if (!(metaW > 0)) continue;

          var col = bubble.closest('.bubble-col') || bubble.parentElement;
          var maxW = col ? col.clientWidth : bubble.clientWidth;
          var cs = window.getComputedStyle(bubble);
          var padL = parseFloat(cs.paddingLeft) || 0;
          var padR = parseFloat(cs.paddingRight) || 0;

          var rects = [];
          for (var n = 0; n < textEl.childNodes.length; n++) {
            var node = textEl.childNodes[n];
            if (node === metaEl) continue;
            if (node.nodeType === 3 && String(node.textContent || '').length) {
              var range = document.createRange();
              range.selectNodeContents(node);
              var list = range.getClientRects();
              for (var r = 0; r < list.length; r++) rects.push(list[r]);
            }
          }
          if (!rects.length) {
            var rangeAll = document.createRange();
            rangeAll.selectNodeContents(textEl);
            var listAll = rangeAll.getClientRects();
            for (var a = 0; a < listAll.length; a++) rects.push(listAll[a]);
          }
          if (!rects.length) continue;

          var last = rects[rects.length - 1];
          var bubbleLeft = bubble.getBoundingClientRect().left;
          var lastLineW = last.right - (bubbleLeft + padL);
          var avail = maxW - padL - padR - lastLineW;
          if (avail < metaW + minGap) {
            bubble.classList.add('meta-corner-tuck');
          }
        }
      }
      window.syncMetaSpacers = syncMetaSpacers;

      (scene.items || []).forEach(function (item) {
        if (item.type === 'date') {
          var ds = document.createElement('div');
          ds.className = 'date-sep';
          ds.innerHTML =
            '<span class="date-divider">' + escapeHtml(item.label || '') + '</span>';
          chat.appendChild(ds);
          return;
        }

        var part = participants[item.from];
        if (!part) return;
        var outgoing = part.side === 'right';

        var row = document.createElement('div');
        row.className = 'row ' + (outgoing ? 'out' : 'in');

        var col = document.createElement('div');
        col.className = 'bubble-col';

        var bubble = document.createElement('div');
        bubble.className = 'bubble';
        var imageWrap = null;
        var bubbleText = null;

        if (item.type === 'text') {
          var textValue = item.text || '';
          bubbleText = document.createElement('span');
          bubbleText.className = 'bubble-text';
          bubbleText.textContent = textValue;
          bubble.appendChild(bubbleText);

          var textLen = Array.from(textValue).length;
          var bubbleClass =
            textLen <= 35
              ? 'bubble--ios-a'
              : textLen <= 40
                ? 'bubble--ios-b'
                : textLen <= 75
                  ? 'bubble--ios-c'
                  : textLen <= 80
                    ? 'bubble--ios-d'
                    : 'bubble--ios-e';
          bubble.classList.add(bubbleClass);
        } else if (item.type === 'image') {
          bubble.classList.add('message--media');
          var wrap = document.createElement('div');
          wrap.className = 'message__image-wrap';
          if (item.src) {
            var im = document.createElement('img');
            im.className = 'message__image';
            im.src = item.src;
            im.alt = '';
            wrap.appendChild(im);
          } else {
            var ph = document.createElement('div');
            ph.className = 'message__image-placeholder';
            ph.textContent = 'Изображение';
            wrap.appendChild(ph);
          }
          imageWrap = wrap;
          bubble.appendChild(wrap);
          if (item.caption) {
            var cap = document.createElement('div');
            cap.className = 'message__caption';
            cap.textContent = item.caption;
            bubble.appendChild(cap);
          }
          if (item.action != null && String(item.action).trim() !== '') {
            var act = document.createElement('div');
            act.className = 'message__action';
            act.textContent = String(item.action);
            bubble.appendChild(act);
          }
        }

        var meta = document.createElement('span');
        meta.className = 'meta';
        var edited =
          item.edited === true || item.edited === 1 || item.edited === '1' || item.edited === 'true';
        if (edited) {
          var ed = document.createElement('span');
          ed.className = 'meta-edited';
          ed.textContent = 'изменено ';
          meta.appendChild(ed);
        }
        meta.appendChild(document.createTextNode(item.time || ''));
        if (outgoing) {
          var ck = document.createElement('span');
          ck.className = 'checks';
          var ckImg = document.createElement('img');
          ckImg.className = 'checks-img';
          ckImg.src = '__MESSAGE_CHECKS_SRC__';
          ckImg.alt = '';
          ckImg.decoding = 'async';
          ckImg.setAttribute('aria-hidden', 'true');
          ck.appendChild(ckImg);
          meta.appendChild(ck);
        }
        var hasImageCaption =
          item.type === 'image' && item.caption != null && String(item.caption).trim() !== '';
        if (item.type === 'image' && imageWrap && !hasImageCaption) {
          imageWrap.classList.add('message__image-wrap--overlay');
          imageWrap.appendChild(meta);
        } else {
          bubble.appendChild(meta);
        }

        col.appendChild(bubble);
        row.appendChild(col);

        chat.appendChild(row);
      });

      applyOutgoingBubbleVerticalGradient();
      applyLightImageOverlayMeta();
      syncMetaSpacers();
      requestAnimationFrame(function () {
        requestAnimationFrame(function () {
          applyOutgoingBubbleVerticalGradient();
          applyLightImageOverlayMeta();
          syncMetaSpacers();
        });
      });
      window.addEventListener('load', function () {
        applyOutgoingBubbleVerticalGradient();
        applyLightImageOverlayMeta();
        syncMetaSpacers();
      });
    })();
  </script>
  <!--
    Live override: npm start кэширует nativeCompositeCss.js, а inject с #chat
    перебивает styles/*.css. Этот блок в HTML читается с диска каждый рендер
    и идёт после head — побеждает по порядку при той же специфичности.
  -->
  <style id="live-meta-single-line-fix">
    .theme-android.phone #chat .row.out .bubble.bubble--ios-a:not(.message--media),
    .theme-android.phone.composite-screen-on #chat .row.out .bubble.bubble--ios-a:not(.message--media) {
      display: inline-flex !important;
      flex-direction: row !important;
      flex-wrap: nowrap !important;
      align-items: flex-end !important;
      justify-content: flex-start !important;
      column-gap: 0 !important;
      gap: 0 !important;
      position: relative !important;
      width: auto !important;
      max-width: 100% !important;
